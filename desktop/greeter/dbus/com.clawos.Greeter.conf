<!DOCTYPE busconfig PUBLIC
          "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
          "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
    <policy group="cosmic-greeter">
        <allow send_destination="com.clawos.Greeter"
               send_interface="com.clawos.Greeter"
               send_member="GetUserData"/>
        <allow receive_sender="com.clawos.Greeter"/>
    </policy>
    <policy user="cosmic-initial-setup">
        <allow send_destination="com.clawos.Greeter"
               send_interface="com.clawos.Greeter"
               send_member="InitialSetupEnd"/>
        <allow send_destination="com.clawos.Greeter"
               send_interface="com.clawos.Greeter"
               send_member="InitialSetupAbort"/>
        <allow receive_sender="com.clawos.Greeter"/>
    </policy>
    <policy user="root">
        <allow own="com.clawos.Greeter"/>
        <allow send_destination="com.clawos.Greeter"/>
        <allow receive_sender="com.clawos.Greeter"/>
    </policy>
</busconfig>
