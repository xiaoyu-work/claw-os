<?xml version="1.0" encoding="UTF-8"?>
<!--
  ClawOS applet icon.

  Drawn on the shared application plate in the neutral ramp used by the
  rest of the first-party icon set: ink #1F1F20, mid #5A5E66, light
  #8E939C, fill #E8EAEE. The brand accent is reserved for state, so it
  does not appear here.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" fill="none">
  <rect x="16" y="16" width="224" height="224" rx="56" fill="#F7F8FA" stroke="#E1E3E8" stroke-width="4"/>
  <g fill="#1F1F20">
    <rect x="56" y="56" width="40" height="40" rx="12"/>
    <rect x="108" y="56" width="40" height="40" rx="12"/>
    <rect x="160" y="56" width="40" height="40" rx="12"/>
    <rect x="56" y="108" width="40" height="40" rx="12"/>
  </g>
  <g fill="#5A5E66">
    <rect x="108" y="108" width="40" height="40" rx="12"/>
    <rect x="160" y="108" width="40" height="40" rx="12"/>
    <rect x="56" y="160" width="40" height="40" rx="12"/>
  </g>
  <g fill="#8E939C">
    <rect x="108" y="160" width="40" height="40" rx="12"/>
    <rect x="160" y="160" width="40" height="40" rx="12"/>
  </g>
</svg>
