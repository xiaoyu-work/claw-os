<?xml version="1.0" encoding="UTF-8"?>
<!--
  ClawOS applet icon.

  Drawn on the shared application plate in the neutral ramp used by the
  rest of the first-party icon set: ink #1F1F20, mid #5A5E66, light
  #8E939C, fill #E8EAEE. The brand accent is reserved for state, so it
  does not appear here.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" fill="none">
  <rect x="16" y="16" width="224" height="224" rx="56" fill="#F7F8FA" stroke="#E1E3E8" stroke-width="4"/>
  <rect x="48" y="72" width="76" height="112" rx="18" fill="#1F1F20"/>
  <rect x="136" y="72" width="72" height="112" rx="18" fill="#E8EAEE" stroke="#5A5E66" stroke-width="7"/>
  <rect x="66" y="150" width="40" height="10" rx="5" fill="#FFFFFF"/>
  <rect x="152" y="150" width="40" height="10" rx="5" fill="#5A5E66"/>
</svg>
