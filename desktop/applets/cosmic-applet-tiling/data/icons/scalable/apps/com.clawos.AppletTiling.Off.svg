<?xml version="1.0" encoding="UTF-8"?>
<!--
  ClawOS tiling toggle.

  Drawn in currentColor: the applet renders it through `icon_button`,
  which forces symbolic mode and flat-tints the whole file to the panel
  foreground. The applet catalogue draws it untinted, where currentColor
  falls back to the body ink.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none">
  <g fill="currentColor">
    <rect x="1.5" y="4.5" width="8.5" height="8" rx="1.5" opacity="0.55"/>
    <rect x="5.5" y="2" width="9" height="8.5" rx="1.5"/>
  </g>
</svg>
