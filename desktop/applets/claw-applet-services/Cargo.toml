[package]
name = "claw-applet-services"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[workspace]

[features]
default = []
provider = ["dep:claw-os-sdk"]

[[bin]]
name = "claw-calendar-reader"
path = "src/bin/claw-calendar-reader.rs"

[[bin]]
name = "claw-os-applet-provider"
path = "src/bin/claw-os-applet-provider.rs"
required-features = ["provider"]

[[test]]
name = "provider_process"
path = "tests/provider_process.rs"
required-features = ["provider"]

[dependencies]
claw-os-sdk = { path = "../../../claw-os-sdk/rust", optional = true }
libc = "0.2"
jiff = "0.2"
rusqlite = { version = "0.39.0", features = ["bundled", "hooks", "limits"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.49.0", features = ["full"] }

[profile.release]
opt-level = 1
