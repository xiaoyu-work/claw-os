[package]
name = "cosmic-applet-notifications"
version = "1.0.2"
edition = "2024"
license = "GPL-3.0-only"

[dependencies]
claw-notification-presentation = { path = "../../../claw-os-sdk/rust/notification-presentation", version = "0.1", features = ["dbus"] }
anyhow.workspace = true
libcosmic.workspace = true
tokio.workspace = true
futures-util = { workspace = true, features = ["sink"] }
tracing-subscriber.workspace = true
tracing-log.workspace = true
tracing.workspace = true
# Application i18n
i18n-embed = { workspace = true, features = [
    "fluent-system",
    "desktop-requester",
] }
i18n-embed-fl.workspace = true
rust-embed.workspace = true
zbus = { workspace = true, features = ["tokio", "p2p"] }
