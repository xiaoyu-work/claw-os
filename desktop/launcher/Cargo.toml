[package]
name = "cosmic-launcher"
version = "1.0.12"
authors = ["Ashley Wulber <ashley@system76.com>"]
edition = "2024"
rust-version = "1.93"

[features]
default = []
wgpu = ["libcosmic/wgpu"]
console = ["tokio/tracing"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
cos-mcp-serve = { path = "../../crates/cos-mcp-serve" }
console-subscriber = "0.5.0"
futures = "0.3.31"
i18n-embed = { version = "0.16", features = [
    "fluent-system",
    "desktop-requester",
] }
i18n-embed-fl = "0.10"
libcosmic = { git = "https://github.com/pop-os/libcosmic/", features = [
    "autosize",
    "dbus-config",
    "winit",
    "multi-window",
    "wayland",
    "tokio",
    "single-instance",
    "desktop-systemd-scope",
    "xdg-portal",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.22", default-features = false, features = [
    "std",
    "fmt",
    "env-filter",
] }
tracing-journald = "0.3.2"
tokio-stream = "0.1.18"
nix = { version = "0.31.1", features = ["process"] }
pop-launcher = { path = "../launcher-backend" }
pop-launcher-service = { path = "../launcher-backend/service" }
rust-embed = "8.11.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["sync", "rt", "process", "io-util", "macros"] }
clap = { version = "4.5.56", features = ["derive"] }
switcheroo-control = { git = "https://github.com/pop-os/dbus-settings-bindings" }
zbus = { version = "5.13", default-features = false, features = ["tokio"] }

# [patch.'https://github.com/pop-os/libcosmic']
# libcosmic = { git = "https://github.com/pop-os/libcosmic//" }
# cosmic-config = { git = "https://github.com/pop-os/libcosmic//" }
# cosmic-theme = { git = "https://github.com/pop-os/libcosmic//" }
# libcosmic = { path = "../libcosmic" }
# cosmic-config = { path = "../libcosmic/cosmic-config" }
# cosmic-theme = { path = "../libcosmic/cosmic-theme" }

[workspace]
# Opt out of repo-root workspace; this crate has its own dependency graph.

# Build the shell against the vendored toolkit rather than upstream libcosmic.
# ClawOS restyles system chrome (popup shells, tooltips, menus) inside
# `desktop/toolkit`; without this patch the launcher would keep resolving the
# pinned upstream crate and render stock COSMIC grey instead.
[patch.'https://github.com/pop-os/libcosmic']
cosmic-config = { path = "../toolkit/cosmic-config" }
cosmic-config-derive = { path = "../toolkit/cosmic-config-derive" }
cosmic-theme = { path = "../toolkit/cosmic-theme" }
iced = { path = "../toolkit/iced" }
iced_accessibility = { path = "../toolkit/iced/accessibility" }
iced_core = { path = "../toolkit/iced/core" }
iced_debug = { path = "../toolkit/iced/debug" }
iced_futures = { path = "../toolkit/iced/futures" }
iced_graphics = { path = "../toolkit/iced/graphics" }
iced_program = { path = "../toolkit/iced/program" }
iced_renderer = { path = "../toolkit/iced/renderer" }
iced_runtime = { path = "../toolkit/iced/runtime" }
iced_tiny_skia = { path = "../toolkit/iced/tiny_skia" }
iced_wgpu = { path = "../toolkit/iced/wgpu" }
iced_widget = { path = "../toolkit/iced/widget" }
iced_winit = { path = "../toolkit/iced/winit" }
libcosmic = { path = "../toolkit" }
