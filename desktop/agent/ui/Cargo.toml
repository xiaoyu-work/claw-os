[package]
name = "cos-agent-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "ClawOS Agent — native libcosmic UI (replaces the React + WebView app)."

[[bin]]
name = "cos-agent-ui"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
i18n-embed = { version = "0.16", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.10"
rust-embed = "8.11"

reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "json", "multipart"] }
futures = "0.3"
futures-util = "0.3"
async-stream = "0.3"
bytes = "1"
uuid = { version = "1", features = ["v4"] }
url = "2"

# Microphone capture (replaces React's MediaRecorder + getUserMedia).
# cpal is the standard cross-platform audio crate; on Linux it talks
# ALSA directly so we don't need PulseAudio glue. hound writes WAVs in
# pure Rust — we use a 16 kHz mono i16 spec because the bridge's STT
# backend treats `audio/wav` as the canonical upload format.
cpal = "0.15"
hound = "3.5"

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
default-features = false
features = [
    "multi-window",
    "tokio",
    "winit",
    "surface-message",
    "wgpu",
    "wayland",
    "markdown",
    "single-instance",
    "xdg-portal",
]

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
strip = true
