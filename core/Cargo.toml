[package]
name = "cos"
version = "0.1.0"
edition = "2021"
description = "Claw OS — agent-native operating system core"

[[bin]]
name = "cos"
path = "src/main.rs"

[features]
default = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

# --- Phase 0 (agent runtime) ---
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "io-util", "io-std", "net", "sync", "signal", "process", "fs", "test-util"] }
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "multipart"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"
rusqlite = { version = "0.39.0", features = ["bundled"] }
base64 = "0.22.1"
zip = { version = "8.6.0", default-features = false, features = ["deflate", "deflate64", "bzip2", "zstd"] }
tempfile = "3.27.0"
regex = "1"

# Phase 0.5 (engine package management): native runtimes (llama.cpp, ort,
# ort-genai) are installed by `cos engine update` to /var/lib/cos/engines and
# loaded at runtime via libloading. No more compile-time link.
libloading = "0.8"

# Phase 2.4 (engine compat enforcement): semver ranges for ort / ort-genai;
# llama.cpp's `bNNNN` build numbers use a custom comparator in
# crate::model::compat.
semver = "1"

# Phase 0.5 (model engines): added when model files arrive
# ort = { version = "2", features = [...] }

# Phase 3 / 6 (added later)
# fastembed = "..."
# rmcp = "..."
# serde_yaml = "..."

[target.'cfg(unix)'.dependencies]
libc = "0.2"
