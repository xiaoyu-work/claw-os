[package]
name = "cos"
version = "0.1.0"
edition = "2021"
description = "Claw OS — agent-native operating system core"

[lib]
name = "cos"
path = "src/lib.rs"

[[bin]]
name = "cos"
path = "src/main.rs"

[[bin]]
name = "clawd"
path = "src/bin/clawd.rs"

[features]
default = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

# --- Phase 0 (agent runtime) ---
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "io-util", "io-std", "net", "sync", "signal", "process", "fs", "test-util"] }
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "multipart"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"
rusqlite = { version = "0.39.0", features = ["bundled"] }
base64 = "0.22.1"
zip = { version = "8.6.0", default-features = false, features = ["deflate", "deflate64", "bzip2", "zstd"] }
flate2 = "1.1"
tar = "0.4"
tempfile = "3.27.0"
regex = "1"
bytes = "1"
crc32fast = "1"

# Phase 7 (skill bundle signatures): ed25519 verification for skill
# manifests so a `Vendor`/`Hub` install can be authenticated against a
# release key. Default features off — we only need verification, not
# signing/PEM/PKCS#8 import.
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
hex = "0.4"

# Phase 5.5 (Edge TTS): WebSocket client. Aligned with workspace 0.26 + rustls
# to match `reqwest`'s `rustls-tls` feature already in use here, so the binary
# carries one TLS stack (rustls) instead of two.
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }

# Phase 0.5 (engine package management): native runtimes (llama.cpp, ort,
# ort-genai) are installed by `cos engine update` to /var/lib/cos/engines and
# loaded at runtime via libloading. No more compile-time link.
libloading = "0.8"

# Phase 2.4 (engine compat enforcement): semver ranges for ort / ort-genai;
# llama.cpp's `bNNNN` build numbers use a custom comparator in
# crate::model::compat.
semver = "1"

# Phase 0.5 (model engines): added when model files arrive
# ort = { version = "2", features = [...] }

# Phase 3 / 6 (added later)
# fastembed = "..."
# rmcp = "..."
# serde_yaml = "..."

# claw-embed: pure embedding abstractions (Embedder trait + types,
# SemanticStore). Lives in this workspace at crates/claw-embed/. We
# depend on it so core can keep the config-aware factories
# (`build_default`, `open_default`, `default_path`) while the storage
# and trait definitions are reusable from claw-semantic and any other
# future consumer.
claw-embed = { path = "../crates/claw-embed" }

# `cos agent serve` — built-in web UI for headless / WSL setups. axum +
# tower-http give us SSE streaming and a minimal HTTP surface without
# pulling in a heavy framework. Pinned to versions compatible with the
# tokio 1.x runtime already in use; default features only (no openssl).
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
tower = { version = "0.5", default-features = false }
tower-http = { version = "0.6", default-features = false, features = ["cors"] }
http = "1"

# Embed the Vite-built web UI (HTML/JS/CSS) inside the cos binary so
# `cos agent serve` stays a single self-contained file with zero
# external assets. The `ui/dist/` directory is committed to git.
include_dir = "0.7"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
