[workspace]
resolver = "2"
members = [
    "core",
    "claw-os-sdk/rust",
    "claw-os-sdk/rust/notification-presentation",
    "cos-runtime/rust",
    "crates/clawd-client",
    "crates/claw-display-control",
    "crates/claw-compositor",
    "crates/claw-display-login",
    "crates/cos-cli",
    "crates/claw-semantic",
    "crates/claw-embed",
]
exclude = ["build/app-sources", "crates/claw-nearby"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/xiaoyu-work/claw-os"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
anyhow = "1"
base64 = "0.22"

# Fresh provenance checks hash complete payloads in dev and inherited test builds.
[profile.dev.package.sha2]
opt-level = 3
