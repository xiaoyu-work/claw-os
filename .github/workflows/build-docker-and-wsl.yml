name: Build Docker image + WSL package

on:
  workflow_dispatch:
  workflow_call:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Docker and WSL are two packagings of the same OS tree, so they share one
# rootfs build per architecture. Splitting them into separate workflows would
# mean running debootstrap, the chroot package installs and the Qwen3 model
# download twice for identical output.
jobs:
  prepare-apt-key:
    runs-on: ubuntu-latest
    outputs:
      signing-available: ${{ steps.detect.outputs.available }}
    steps:
      - uses: actions/checkout@v5

      - name: Detect apt signing key
        id: detect
        env:
          CLAW_OS_APT_SIGNING_PRIVATE_KEY: ${{ secrets.CLAW_OS_APT_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$CLAW_OS_APT_SIGNING_PRIVATE_KEY" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLAW_OS_APT_SIGNING_PRIVATE_KEY is not configured; building without the apt-source feature"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Export apt archive public key
        if: steps.detect.outputs.available == 'true'
        env:
          CLAW_OS_APT_SIGNING_PRIVATE_KEY: ${{ secrets.CLAW_OS_APT_SIGNING_PRIVATE_KEY }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/claw-os-apt-gnupg"
          trap 'rm -rf "$GNUPGHOME"' EXIT
          mkdir -m 700 -p "$GNUPGHOME"
          printf '%s' "$CLAW_OS_APT_SIGNING_PRIVATE_KEY" | gpg --batch --import
          key_id="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "sec" { print $5; exit }')"
          test -n "$key_id"
          mkdir -p build/apt-key
          gpg --batch --export "$key_id" > build/apt-key/claw-os-archive-keyring.gpg
          test -s build/apt-key/claw-os-archive-keyring.gpg

      - name: Upload apt archive public key
        if: steps.detect.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: claw-os-apt-public-key-images
          path: build/apt-key/claw-os-archive-keyring.gpg
          if-no-files-found: error

  build-rootfs-docker-wsl:
    needs: prepare-apt-key
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
            rust_targets: x86_64-unknown-linux-musl,x86_64-unknown-linux-gnu
            musl_target: x86_64-unknown-linux-musl
            gnu_target: x86_64-unknown-linux-gnu
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            rust_targets: aarch64-unknown-linux-musl,aarch64-unknown-linux-gnu
            musl_target: aarch64-unknown-linux-musl
            gnu_target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write  # Docker push to GHCR
    env:
      ARCH: ${{ matrix.arch }}
      ROOTFS_FEATURES: base,cos-core,browser,systemd,gpu-drivers${{ needs.prepare-apt-key.outputs.signing-available == 'true' && ',apt-source' || '' }},qwen3-embedding

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download apt archive public key
        if: needs.prepare-apt-key.outputs.signing-available == 'true'
        uses: actions/download-artifact@v4
        with:
          name: claw-os-apt-public-key-images
          path: packaging/apt-repo

      # cos (musl, static) and cos-browser (gnu, V8 needs glibc).
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Install host build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y musl-tools debootstrap curl ca-certificates python3 gnupg

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-build-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-build-

      - name: Build cos binary (musl)
        run: cargo build --release -p cos --target ${{ matrix.musl_target }}

      - name: Build cos-browser binary (gnu)
        run: cargo build --release -p cos-browser --target ${{ matrix.gnu_target }}

      - name: Build claw-semantic binaries (gnu)
        run: cargo build --release -p claw-semantic --target ${{ matrix.gnu_target }}

      # Build the headless rootfs ONCE. The Docker image and the WSL package
      # below both consume this same tree.
      - name: Build headless rootfs (shared with Docker + WSL)
        run: sudo ARCH="$ARCH" ./rootfs/build.sh --features "$ROOTFS_FEATURES"

      - name: Verify shared rootfs has no human account
        run: |
          sudo bash -c '
            source scripts/lib/image-identity.sh
            assert_no_human_login_users build/claw-os-rootfs "shared ${{ matrix.arch }} rootfs"
          '

      # Docker build (FROM scratch — no base image)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker ${{ matrix.arch }} image
        env:
          DOCKER_LABELS: ${{ steps.meta.outputs.labels }}
        run: |
          label_args=()
          while IFS= read -r label; do
            [ -n "$label" ] && label_args+=(--label "$label")
          done <<< "$DOCKER_LABELS"
          sudo tar --numeric-owner -cf - \
            targets/docker/Dockerfile targets/docker/container-entrypoint.sh \
            build/claw-os-rootfs \
            | docker buildx build \
                --platform ${{ matrix.platform }} \
                --file targets/docker/Dockerfile \
                --build-arg ROOTFS_DIR=build/claw-os-rootfs \
                --tag "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-${{ matrix.arch }}" \
                "${label_args[@]}" --push -

      - name: Remove Docker ${{ matrix.arch }} build cache
        if: always()
        run: docker buildx prune --all --force || true

      # targets/wsl/build.sh re-invokes rootfs/build.sh with
      # --reuse-if-matching, which is a no-op here: the stamp written by the
      # step above matches, so the tree is reused rather than rebuilt.
      - name: Package WSL ${{ matrix.arch }} distribution
        run: sudo ARCH="$ARCH" FEATURES="$ROOTFS_FEATURES" ./targets/wsl/build.sh

      - name: Fix build/ ownership for non-sudo steps
        run: sudo chown -R "$(id -u):$(id -g)" build

      - name: Compute SHA-256 for WSL ${{ matrix.arch }} artifact
        run: |
          cd build
          sha256sum "claw-os-wsl-${ARCH}.wsl" > "claw-os-wsl-${ARCH}.wsl.sha256"
          SHA=$(cut -d' ' -f1 "claw-os-wsl-${ARCH}.wsl.sha256")
          SIZE=$(du -h "claw-os-wsl-${ARCH}.wsl" | cut -f1)
          echo "## Claw OS WSL ${ARCH} build" >> "$GITHUB_STEP_SUMMARY"
          echo "- File: \`claw-os-wsl-${ARCH}.wsl\` ($SIZE)" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA-256: \`$SHA\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload WSL ${{ matrix.arch }} package as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: claw-os-wsl-${{ matrix.arch }}
          path: |
            build/claw-os-wsl-${{ matrix.arch }}.wsl
            build/claw-os-wsl-${{ matrix.arch }}.wsl.sha256
          if-no-files-found: error
          retention-days: 90

  publish-docker-manifest:
    needs: build-rootfs-docker-wsl
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Publish multi-arch Docker manifest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          SOURCE_AMD64: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-amd64
          SOURCE_ARM64: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-arm64
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            echo ":: publishing $tag"
            docker buildx imagetools create \
              --tag "$tag" \
              "$SOURCE_AMD64" \
              "$SOURCE_ARM64"
          done <<< "$TAGS"

          first_tag="$(printf '%s\n' "$TAGS" | sed -n '1p')"
          docker buildx imagetools inspect "$first_tag"

  publish-wsl-release:
    needs: build-rootfs-docker-wsl
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download WSL amd64 artifact
        uses: actions/download-artifact@v4
        with:
          name: claw-os-wsl-amd64
          path: build

      - name: Download WSL arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: claw-os-wsl-arm64
          path: build

      - name: Compute WSL release metadata
        id: artifact
        run: |
          cd build
          for arch in amd64 arm64; do
            sha256sum "claw-os-wsl-${arch}.wsl" > "claw-os-wsl-${arch}.wsl.sha256"
            sha=$(cut -d' ' -f1 "claw-os-wsl-${arch}.wsl.sha256")
            size=$(du -h "claw-os-wsl-${arch}.wsl" | cut -f1)
            echo "${arch}_sha=$sha" >> "$GITHUB_OUTPUT"
            echo "${arch}_size=$size" >> "$GITHUB_OUTPUT"
            echo "- claw-os-wsl-${arch}.wsl ($size): \`$sha\`" >> "$GITHUB_STEP_SUMMARY"
          done

      # Rolling pre-release on every run from main, so there is always a
      # stable download URL pointing at the latest build of main:
      #   https://github.com/<org>/<repo>/releases/download/wsl-latest/claw-os-wsl-amd64.wsl
      #   https://github.com/<org>/<repo>/releases/download/wsl-latest/claw-os-wsl-arm64.wsl
      - name: Publish rolling pre-release (main only)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: wsl-latest
          name: WSL rolling build (main)
          prerelease: true
          target_commitish: ${{ github.sha }}
          body: |
            Rolling build of `main` for WSL2 installation on Windows.

            **Commit:** ${{ github.sha }}

            | Architecture | File | SHA-256 | Size |
            |---|---|---|---|
            | amd64 | `claw-os-wsl-amd64.wsl` | `${{ steps.artifact.outputs.amd64_sha }}` | ${{ steps.artifact.outputs.amd64_size }} |
            | arm64 | `claw-os-wsl-arm64.wsl` | `${{ steps.artifact.outputs.arm64_sha }}` | ${{ steps.artifact.outputs.arm64_size }} |

            ## Install on Windows
            ```powershell
            # Download the package matching your Windows CPU architecture:
            #   x64 Windows:       claw-os-wsl-amd64.wsl
            #   Windows on ARM64:  claw-os-wsl-arm64.wsl
            $package = if ($env:PROCESSOR_ARCHITECTURE -eq "ARM64") { ".\claw-os-wsl-arm64.wsl" } else { ".\claw-os-wsl-amd64.wsl" }
            $installPath = "C:\WSL\claw-os"
            wsl --install --from-file $package --name claw-os --location $installPath --version 2
            ```

            First launch asks you to create the UNIX username and password.
          files: |
            build/claw-os-wsl-amd64.wsl
            build/claw-os-wsl-amd64.wsl.sha256
            build/claw-os-wsl-arm64.wsl
            build/claw-os-wsl-arm64.wsl.sha256

      - name: Move rolling tag to the published commit (main only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/git/refs/tags/wsl-latest" \
            -f sha="${GITHUB_SHA}" -F force=true

      # Versioned release on a manually selected v* tag.
      - name: Publish versioned release (tag run)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Claw OS ${{ github.ref_name }}
          body: |
            Claw OS ${{ github.ref_name }} — installable WSL2 distributions.

            | Architecture | File | SHA-256 | Size |
            |---|---|---|---|
            | amd64 | `claw-os-wsl-amd64.wsl` | `${{ steps.artifact.outputs.amd64_sha }}` | ${{ steps.artifact.outputs.amd64_size }} |
            | arm64 | `claw-os-wsl-arm64.wsl` | `${{ steps.artifact.outputs.arm64_sha }}` | ${{ steps.artifact.outputs.arm64_size }} |

            ## Install on Windows
            ```powershell
            $package = if ($env:PROCESSOR_ARCHITECTURE -eq "ARM64") { ".\claw-os-wsl-arm64.wsl" } else { ".\claw-os-wsl-amd64.wsl" }
            $installPath = "C:\WSL\claw-os"
            wsl --install --from-file $package --name claw-os --location $installPath --version 2
            ```
            First launch asks you to create the UNIX username and password.
          files: |
            build/claw-os-wsl-amd64.wsl
            build/claw-os-wsl-amd64.wsl.sha256
            build/claw-os-wsl-arm64.wsl
            build/claw-os-wsl-arm64.wsl.sha256
