name: Build Desktop packages

on:
  workflow_dispatch:

# Desktop package builds are intentionally separate from lightweight
# Agent/base publication. They require a full Debian rootfs and the vendored
# desktop workspace, but their artifacts can be supplied to Build APT repo by
# workflow run ID.
jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: claw-os-desktop-amd64
            rust_targets: x86_64-unknown-linux-musl,x86_64-unknown-linux-gnu
            musl_target: x86_64-unknown-linux-musl
            gnu_target: x86_64-unknown-linux-gnu
          - arch: arm64
            runner: claw-os-desktop-arm64
            rust_targets: aarch64-unknown-linux-musl,aarch64-unknown-linux-gnu
            musl_target: aarch64-unknown-linux-musl
            gnu_target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    env:
      ARCH: ${{ matrix.arch }}
      ROOTFS_FEATURES: base,cos-core,browser,systemd,desktop

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          lfs: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Install host build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y musl-tools debootstrap curl ca-certificates python3 gnupg git-lfs

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-desktop-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-desktop-
            ${{ runner.os }}-${{ runner.arch }}-cargo-build-

      - name: Build reusable Agent binaries
        run: |
          cargo build --release -p cos --target ${{ matrix.musl_target }}
          cargo build --release -p cos-browser --target ${{ matrix.gnu_target }}
          cargo build --release -p claw-semantic --target ${{ matrix.gnu_target }}

      - name: Build desktop package in Debian rootfs
        run: sudo ARCH="$ARCH" ./rootfs/build.sh --features "$ROOTFS_FEATURES"

      - name: Verify desktop package
        run: |
          desktop_deb="$(printf '%s\n' build/debs/claw-os-desktop_*_"$ARCH".deb)"
          test -f "$desktop_deb"
          test "$(dpkg-deb -f "$desktop_deb" Package)" = "claw-os-desktop"
          dpkg-deb -c "$desktop_deb" > "$RUNNER_TEMP/claw-os-desktop.files"
          grep -q './usr/local/bin/cos-agent-ui$' "$RUNNER_TEMP/claw-os-desktop.files"
          grep -q './usr/local/bin/cos-agent-bridge$' "$RUNNER_TEMP/claw-os-desktop.files"
          grep -q './usr/lib/cos/apps/agent/app.json$' "$RUNNER_TEMP/claw-os-desktop.files"
          grep -q './usr/share/applications/com.clawos.Agent.desktop$' "$RUNNER_TEMP/claw-os-desktop.files"

      - name: Upload desktop package
        uses: actions/upload-artifact@v4
        with:
          name: claw-os-desktop-${{ matrix.arch }}
          path: build/debs/claw-os-desktop_*_${{ matrix.arch }}.deb
          if-no-files-found: error
          retention-days: 30
