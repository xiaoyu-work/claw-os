name: Publish Base package

on:
  workflow_dispatch:
    inputs:
      release_security_bootstrap:
        description: >-
          One-time migration: establish the release-security baseline for a
          repository published before downgrade protection existed. Rejected
          once a baseline exists.
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      release_security_bootstrap:
        required: false
        default: false
        type: boolean

jobs:
  build-base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install package build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y dpkg-dev fakeroot

      # The release-security manifest travels inside the .deb and is
      # verified offline by installed systems, so it has to be signed
      # here, while the package is being assembled.
      - name: Import release-security signing key
        env:
          CLAW_OS_APT_SIGNING_PRIVATE_KEY: ${{ secrets.CLAW_OS_APT_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${CLAW_OS_APT_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "error: CLAW_OS_APT_SIGNING_PRIVATE_KEY is required to sign" >&2
            echo "       release-security metadata; publication cannot continue" >&2
            exit 1
          fi
          export GNUPGHOME="$RUNNER_TEMP/claw-os-release-security-gnupg"
          mkdir -m 700 -p "$GNUPGHOME"
          printf '%s' "$CLAW_OS_APT_SIGNING_PRIVATE_KEY" | gpg --batch --import
          key_id="$(gpg --batch --with-colons --list-secret-keys \
            | awk -F: '$1 == "sec" { print $5; exit }')"
          test -n "$key_id"
          # Export exactly the public key that will do the signing, so
          # the build's own signatures are verified against the intended
          # identity rather than against whatever else the runner's
          # keyring happens to trust.
          keyring="$RUNNER_TEMP/claw-os-release-security.gpg"
          gpg --batch --export "$key_id" > "$keyring"
          test -s "$keyring"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          echo "CLAW_OS_RELEASE_SECURITY_KEY_ID=$key_id" >> "$GITHUB_ENV"
          echo "CLAW_OS_RELEASE_SECURITY_KEYRING=$keyring" >> "$GITHUB_ENV"

      - name: Build Base package
        env:
          GPG_PASSPHRASE: ${{ secrets.CLAW_OS_APT_SIGNING_PASSPHRASE }}
        run: ./packaging/deb/build-debs.sh base

      - name: Verify Base package
        run: |
          base_deb="$(printf '%s\n' build/debs/claw-os-base_*_all.deb)"
          test -f "$base_deb"
          test "$(dpkg-deb -f "$base_deb" Package)" = "claw-os-base"
          dpkg-deb -c "$base_deb" > "$RUNNER_TEMP/claw-os-base.files"
          grep -q './usr/local/bin/cos-init$' "$RUNNER_TEMP/claw-os-base.files"
          grep -q './usr/lib/systemd/system/cos-home-setup.service$' "$RUNNER_TEMP/claw-os-base.files"
          ! grep -q './usr/local/bin/cos$' "$RUNNER_TEMP/claw-os-base.files"
          ! grep -q '/usr/lib/cos/apps/' "$RUNNER_TEMP/claw-os-base.files"

      # One shared script binds the embedded manifest to the built
      # control fields and payload for every package, so the three
      # publication workflows cannot drift apart.
      - name: Verify Base release-security metadata
        run: |
          set -euo pipefail
          base_deb="$(printf '%s\n' build/debs/claw-os-base_*_all.deb)"
          ./packaging/release-security/verify-package-manifest.sh "$base_deb" \
            --arch all \
            --require-signature \
            --keyring "$CLAW_OS_RELEASE_SECURITY_KEYRING"

      - name: Upload Base package
        uses: actions/upload-artifact@v4
        with:
          name: claw-os-base
          path: build/debs/claw-os-base_*_all.deb
          if-no-files-found: error

  publish-base:
    needs: build-base
    uses: ./.github/workflows/publish-apt-repo.yml
    with:
      artifact_pattern: claw-os-base
      pages_artifact_name: github-pages-base
      release_security_bootstrap: ${{ inputs.release_security_bootstrap }}
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    secrets: inherit
