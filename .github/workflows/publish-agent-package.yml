name: Publish Agent package

on:
  workflow_dispatch:
    inputs:
      release_security_bootstrap:
        description: >-
          One-time migration: establish the release-security baseline for a
          repository published before downgrade protection existed. Rejected
          once a baseline exists.
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      release_security_bootstrap:
        required: false
        default: false
        type: boolean

jobs:
  build-agent:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            rust_targets: x86_64-unknown-linux-musl,x86_64-unknown-linux-gnu
            musl_target: x86_64-unknown-linux-musl
            gnu_target: x86_64-unknown-linux-gnu
          - arch: arm64
            runner: ubuntu-24.04-arm
            rust_targets: aarch64-unknown-linux-musl,aarch64-unknown-linux-gnu
            musl_target: aarch64-unknown-linux-musl
            gnu_target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    env:
      ARCH: ${{ matrix.arch }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Install host build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y musl-tools dpkg-dev fakeroot

      # Release-security metadata is signed by the same publisher
      # identity that signs the repository. It has to be signed here,
      # while the package is being assembled, because the manifest
      # travels *inside* the .deb: an installed system verifies it
      # offline, without re-fetching anything.
      - name: Import release-security signing key
        env:
          CLAW_OS_APT_SIGNING_PRIVATE_KEY: ${{ secrets.CLAW_OS_APT_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${CLAW_OS_APT_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "error: CLAW_OS_APT_SIGNING_PRIVATE_KEY is required to sign" >&2
            echo "       release-security metadata; publication cannot continue" >&2
            exit 1
          fi
          export GNUPGHOME="$RUNNER_TEMP/claw-os-release-security-gnupg"
          mkdir -m 700 -p "$GNUPGHOME"
          printf '%s' "$CLAW_OS_APT_SIGNING_PRIVATE_KEY" | gpg --batch --import
          key_id="$(gpg --batch --with-colons --list-secret-keys \
            | awk -F: '$1 == "sec" { print $5; exit }')"
          test -n "$key_id"
          # Export exactly the public key that will do the signing, so
          # the build's own signatures are verified against the intended
          # identity rather than against whatever else the runner's
          # keyring happens to trust.
          keyring="$RUNNER_TEMP/claw-os-release-security.gpg"
          gpg --batch --export "$key_id" > "$keyring"
          test -s "$keyring"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          echo "CLAW_OS_RELEASE_SECURITY_KEY_ID=$key_id" >> "$GITHUB_ENV"
          echo "CLAW_OS_RELEASE_SECURITY_KEYRING=$keyring" >> "$GITHUB_ENV"

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-agent-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-agent-
            ${{ runner.os }}-${{ runner.arch }}-cargo-build-

      - name: Build Agent binaries
        run: |
          cargo build --release -p cos --target ${{ matrix.musl_target }}
          cargo build --release -p cos-browser --target ${{ matrix.gnu_target }}
          cargo build --release -p claw-semantic --target ${{ matrix.gnu_target }}

      - name: Build Agent package
        env:
          GPG_PASSPHRASE: ${{ secrets.CLAW_OS_APT_SIGNING_PASSPHRASE }}
        run: ARCH="$ARCH" ./packaging/deb/build-debs.sh agent

      - name: Verify Agent package
        run: |
          agent_deb="$(printf '%s\n' build/debs/claw-os-agent_*_"$ARCH".deb)"
          test -f "$agent_deb"
          test "$(dpkg-deb -f "$agent_deb" Package)" = "claw-os-agent"
          dpkg-deb -c "$agent_deb" > "$RUNNER_TEMP/claw-os-agent.files"
          grep -q './usr/local/bin/cos$' "$RUNNER_TEMP/claw-os-agent.files"
          grep -q './usr/local/bin/clawd$' "$RUNNER_TEMP/claw-os-agent.files"
          grep -q './usr/local/bin/cos-browser$' "$RUNNER_TEMP/claw-os-agent.files"
          grep -q './usr/local/bin/claw-semantic$' "$RUNNER_TEMP/claw-os-agent.files"
          grep -q './usr/local/bin/claw-semantic-daemon$' "$RUNNER_TEMP/claw-os-agent.files"
          grep -q './usr/lib/cos/apps/web/app.json$' "$RUNNER_TEMP/claw-os-agent.files"
          grep -q './usr/lib/cos/skills/claw-os/SKILL.md$' "$RUNNER_TEMP/claw-os-agent.files"
          grep -q './usr/lib/cos/skills/claw-os/diagnostics.md$' "$RUNNER_TEMP/claw-os-agent.files"
          grep -q './usr/lib/systemd/system/clawd.service$' "$RUNNER_TEMP/claw-os-agent.files"
          skill_extract="$RUNNER_TEMP/claw-os-agent-skill-permissions"
          mkdir -p "$skill_extract"
          dpkg-deb -x "$agent_deb" "$skill_extract"
          test "$(stat -c '%a' "$skill_extract/usr/lib/cos/skills/claw-os")" = "755"
          test "$(stat -c '%a' "$skill_extract/usr/lib/cos/skills/claw-os/SKILL.md")" = "644"
          ! grep -q './etc/cos/oauth.conf$' "$RUNNER_TEMP/claw-os-agent.files"
          ! grep -q '/apps/agent/' "$RUNNER_TEMP/claw-os-agent.files"
          ! grep -q '/apps/panel-calendar/' "$RUNNER_TEMP/claw-os-agent.files"

      # Update downgrade protection has to be *in* the artifact, not
      # only in the tree that produced it: the verifier, the signed
      # release manifest, the APT hook, and a preinst that already
      # carries this candidate's own evidence.
      #
      # The binding checks live in one shared script so the three
      # publication workflows cannot drift apart.
      - name: Verify Agent release-security metadata
        run: |
          set -euo pipefail
          agent_deb="$(printf '%s\n' build/debs/claw-os-agent_*_"$ARCH".deb)"
          grep -q './usr/lib/cos/bin/claw-security-floor$' "$RUNNER_TEMP/claw-os-agent.files"
          grep -q './usr/lib/cos/apt/security-floor-hook$' "$RUNNER_TEMP/claw-os-agent.files"
          grep -q './etc/apt/apt.conf.d/50claw-os-security-floor$' "$RUNNER_TEMP/claw-os-agent.files"
          ./packaging/release-security/verify-package-manifest.sh "$agent_deb" \
            --arch "$ARCH" \
            --require-signature \
            --keyring "$CLAW_OS_RELEASE_SECURITY_KEYRING"

      - name: Install Agent package on Ubuntu
        run: |
          agent_deb="$(printf '%s\n' build/debs/claw-os-agent_*_"$ARCH".deb)"
          sudo apt-get install -y --no-install-recommends "$PWD/$agent_deb"
          for attempt in {1..30}; do
            if sudo systemctl is-active --quiet clawd.service \
                && sudo test -S /run/cos/clawd.sock; then
              break
            fi
            sleep 1
          done
          if ! sudo systemctl is-enabled --quiet clawd.service \
              || ! sudo systemctl is-active --quiet clawd.service \
              || ! sudo test -S /run/cos/clawd.sock; then
            sudo systemctl status clawd.service --no-pager || true
            sudo journalctl -u clawd.service --no-pager -n 100 || true
            exit 1
          fi
          /usr/local/bin/cos-browser --help >/dev/null
          COS_USER_DATA_DIR="$RUNNER_TEMP/cos-user-data" \
            /usr/local/bin/cos agent skills list \
            | python3 -c 'import json,sys; data=json.load(sys.stdin); assert "claw-os" in data["names"]'
          COS_USER_DATA_DIR="$RUNNER_TEMP/cos-user-data" \
            /usr/local/bin/cos agent skills info claw-os \
            | python3 -c 'import json,sys; data=json.load(sys.stdin); assert data["source"] == "builtin"'
          timeout 15s sudo /usr/local/bin/cos agent service status \
            | python3 -c 'import json,sys; data=json.load(sys.stdin); assert data["status"] == "running", data; assert data["daemon"] == "clawd", data'

      - name: Upload Agent package
        uses: actions/upload-artifact@v4
        with:
          name: claw-os-agent-${{ matrix.arch }}
          path: build/debs/claw-os-agent_*_${{ matrix.arch }}.deb
          if-no-files-found: error

  publish-agent:
    needs: build-agent
    uses: ./.github/workflows/publish-apt-repo.yml
    with:
      artifact_pattern: claw-os-agent-*
      pages_artifact_name: github-pages-agent
      release_security_bootstrap: ${{ inputs.release_security_bootstrap }}
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    secrets: inherit
