name: Build and Publish

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
          components: clippy, rustfmt

      - name: Install musl tools
        run: sudo apt-get update -qq && sudo apt-get install -y musl-tools

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      - name: Clippy lint (cos)
        run: cd core && cargo clippy --target x86_64-unknown-linux-musl -- -D warnings

      - name: Run cos tests
        # `--test-threads=1` because many tests in `cos` mutate process-wide
        # env vars (`COS_DATA_DIR`, `COS_SESSION`, `COS_PERMS_MODE`, …).
        # Each module guards its own state with a per-module `Mutex<()>`,
        # but the env vars themselves are shared, so two modules racing on
        # separate locks still trample each other. Running serially is the
        # cheapest fix; the lib test binary finishes in ~70s.
        run: cd core && cargo test -- --test-threads=1

      - name: Run cos-browser tests
        run: cargo test -p cos-browser

      - name: Install Python test dependencies
        run: python3 -m pip install --disable-pip-version-check pytest

      - name: Run Python tests
        env:
          PYTHONPATH: claw-os-sdk/python/src:cos-runtime/python/src
        run: python3 -m pytest -q apps adapters claw-os-sdk/python/src cos-runtime/python/src

  # Exports the public half of the apt signing key for the rootfs builds.
  #
  # Signing is optional infrastructure: the private key lives in the
  # `CLAW_OS_APT_SIGNING_PRIVATE_KEY` secret, which is not configured on every
  # fork (and is never exposed to pull requests from forks). When the secret is
  # absent this job reports `signing-available=false` instead of failing, and
  # the apt repo jobs downstream skip themselves. That keeps the repo from ever
  # publishing an *unsigned* apt repository while still letting the Docker and
  # WSL pipelines — which do not depend on apt signing — build and publish.
  prepare-apt-key:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      signing-available: ${{ steps.detect.outputs.available }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect apt signing key
        id: detect
        env:
          CLAW_OS_APT_SIGNING_PRIVATE_KEY: ${{ secrets.CLAW_OS_APT_SIGNING_PRIVATE_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo ":: pull request build — apt repo signing and publication skipped"
          elif [ -z "$CLAW_OS_APT_SIGNING_PRIVATE_KEY" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLAW_OS_APT_SIGNING_PRIVATE_KEY is not configured; skipping the apt-source feature and apt repo publication"
            {
              echo "## Apt repository skipped"
              echo
              echo 'The `CLAW_OS_APT_SIGNING_PRIVATE_KEY` secret is not configured, so the'
              echo '`apt-source` feature was left out of the images and the apt repo was'
              echo 'neither built nor published. Docker images and WSL tarballs were'
              echo 'published as usual. Set the secret to enable the signed apt repository.'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Export apt archive public key
        if: steps.detect.outputs.available == 'true'
        env:
          CLAW_OS_APT_SIGNING_PRIVATE_KEY: ${{ secrets.CLAW_OS_APT_SIGNING_PRIVATE_KEY }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/claw-os-apt-gnupg"
          trap 'rm -rf "$GNUPGHOME"' EXIT
          mkdir -m 700 -p "$GNUPGHOME"
          printf '%s' "$CLAW_OS_APT_SIGNING_PRIVATE_KEY" | gpg --batch --import
          key_id="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "sec" { print $5; exit }')"
          test -n "$key_id"
          mkdir -p build/apt-key
          gpg --batch --export "$key_id" > build/apt-key/claw-os-archive-keyring.gpg
          test -s build/apt-key/claw-os-archive-keyring.gpg

      - name: Upload apt archive public key
        if: steps.detect.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: claw-os-apt-public-key
          path: build/apt-key/claw-os-archive-keyring.gpg
          if-no-files-found: error

  # Single amd64 headless OS rootfs, multiple distribution channels.
  #
  # The amd64 rootfs is built once with the full non-desktop runtime surface:
  # `base,cos-core,browser,systemd,apt-source,qwen3-embedding`. That includes
  # Claw's own cos/clawd agent runtime, apps, skills, browser automation, the
  # local Qwen3 embedding stack, and upgrade source. It intentionally excludes
  # desktop UI, installer/boot/VM-only features, and third-party agent providers
  # such as copilot-cli.
  #
  # arm64 builds the same feature list as amd64, including the
  # qwen3-embedding stack. WSL and Docker arm64 are Linux targets.
  #
  # Downstream steps in this job then package that one rootfs into:
  #   - 1 Docker amd64 source image     → GHCR
  #   - 1 WSL amd64 tarball             → workflow artifact
  #   - amd64 .deb packages             → workflow artifact
  #
  # Multi-arch Docker manifest publication, WSL release publication, and apt
  # repo assembly are separate jobs that wait for both amd64 and arm64 builds.
  build-amd64:
    needs: [test, prepare-apt-key]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # Docker push to GHCR
    env:
      # `apt-source` bakes the upgrade channel into the image, which requires
      # the archive public key. Without a signing key there is no repo to point
      # at, so the feature is dropped rather than shipping a broken apt source.
      ROOTFS_FEATURES: base,cos-core,browser,systemd,gpu-drivers${{ needs.prepare-apt-key.outputs.signing-available == 'true' && ',apt-source' || '' }},qwen3-embedding

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download apt archive public key
        if: needs.prepare-apt-key.outputs.signing-available == 'true'
        uses: actions/download-artifact@v4
        with:
          name: claw-os-apt-public-key
          path: packaging/apt-repo

      # cos (musl, static) and cos-browser (gnu, V8 needs glibc).
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,x86_64-unknown-linux-gnu

      - name: Install host build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y musl-tools debootstrap curl ca-certificates python3 gnupg

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      - name: Build cos binary (musl)
        run: cargo build --release -p cos --target x86_64-unknown-linux-musl

      - name: Build cos-browser binary (gnu)
        run: cargo build --release -p cos-browser --target x86_64-unknown-linux-gnu

      - name: Build claw-semantic binaries (gnu)
        run: cargo build --release -p claw-semantic --target x86_64-unknown-linux-gnu

      # Build the headless Claw OS rootfs ONCE. The Docker image and WSL
      # tarball both consume this same tree.
      - name: Build headless rootfs (shared with Docker + WSL)
        run: sudo ./rootfs/build.sh --features "$ROOTFS_FEATURES"

      # Docker-specific prep on a private staging copy:
      #   - Add the default `cos` user (uid 1000, NOPASSWD sudo).
      #   - Pre-create /var/lib/cos/overlay/{base,upper,work} chowned to cos
      #     so cos-home-setup.service can prepare the non-root agent home
      #     when systemd boots the container.
      - name: Stage rootfs for Docker (cos user + overlay scratch dirs)
        run: |
          sudo bash -c '
            set -euo pipefail
            export ROOTFS="$PWD/build/claw-os-rootfs"
            export DOCKER_ROOTFS="$PWD/build/claw-os-docker-rootfs-amd64"
            export DOCKER_UPPER="$PWD/build/.claw-os-docker-upper-amd64"
            export DOCKER_WORK="$PWD/build/.claw-os-docker-work-amd64"
            export PROJECT_DIR="$PWD"
            mountpoint -q "$DOCKER_ROOTFS" 2>/dev/null && umount "$DOCKER_ROOTFS" || true
            rm -rf "$DOCKER_ROOTFS" "$DOCKER_UPPER" "$DOCKER_WORK"
            mkdir -p "$DOCKER_ROOTFS" "$DOCKER_UPPER" "$DOCKER_WORK"
            mount -t overlay overlay \
              -o "lowerdir=$ROOTFS,upperdir=$DOCKER_UPPER,workdir=$DOCKER_WORK" \
              "$DOCKER_ROOTFS"
            source "$PROJECT_DIR/scripts/lib/add-cos-user.sh"
            add_cos_user "$DOCKER_ROOTFS"
            chroot "$DOCKER_ROOTFS" /bin/bash -c "
              set -e
              mkdir -p /var/lib/cos/overlay/base /var/lib/cos/overlay/upper /var/lib/cos/overlay/work
              chown -R cos:cos /var/lib/cos/overlay
            "
          '

      # Docker build (FROM scratch — no base image)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker amd64 image
        env:
          DOCKER_LABELS: ${{ steps.meta.outputs.labels }}
        run: |
          label_args=()
          while IFS= read -r label; do
            [ -n "$label" ] && label_args+=(--label "$label")
          done <<< "$DOCKER_LABELS"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            output_flag=--output=type=cacheonly
          else
            output_flag=--push
          fi
          sudo tar --numeric-owner -cf - \
            targets/docker/Dockerfile build/claw-os-docker-rootfs-amd64 \
            | docker buildx build \
                --platform linux/amd64 \
                --file targets/docker/Dockerfile \
                --build-arg ROOTFS_DIR=build/claw-os-docker-rootfs-amd64 \
                --tag "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-amd64" \
                "${label_args[@]}" "$output_flag" -

      - name: Remove Docker amd64 staging
        if: always()
        run: |
          sudo umount build/claw-os-docker-rootfs-amd64 2>/dev/null || true
          sudo rm -rf build/claw-os-docker-rootfs-amd64 \
            build/.claw-os-docker-upper-amd64 build/.claw-os-docker-work-amd64
          docker buildx prune --all --force || true

      # WSL packaging — same amd64 rootfs we just shipped to Docker, plus the
      # WSL-specific overlay (/etc/wsl.conf). targets/wsl/build.sh detects
      # the existing rootfs and skips the rootfs rebuild.
      - name: Package WSL amd64 rootfs tarball
        run: sudo FEATURES="$ROOTFS_FEATURES" ./targets/wsl/build.sh

      - name: Fix build/ ownership for non-sudo steps
        run: sudo chown -R "$(id -u):$(id -g)" build

      - name: Upload amd64 .deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: claw-os-debs-amd64
          path: build/debs/*.deb
          if-no-files-found: error

      - name: Compute SHA-256 for WSL amd64 artifact
        id: artifact
        run: |
          cd build
          sha256sum claw-os-wsl-amd64.tar.gz > claw-os-wsl-amd64.tar.gz.sha256
          SHA=$(cut -d' ' -f1 claw-os-wsl-amd64.tar.gz.sha256)
          SIZE=$(du -h claw-os-wsl-amd64.tar.gz | cut -f1)
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "## Claw OS WSL build" >> "$GITHUB_STEP_SUMMARY"
          echo "- File: \`claw-os-wsl-amd64.tar.gz\` ($SIZE)" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA-256: \`$SHA\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload WSL tarball as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: claw-os-wsl-amd64
          path: |
            build/claw-os-wsl-amd64.tar.gz
            build/claw-os-wsl-amd64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 90

  build-arm64:
    needs: [test, prepare-apt-key]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write  # Docker push to GHCR
    env:
      ARCH: arm64
      ROOTFS_FEATURES: base,cos-core,browser,systemd,gpu-drivers${{ needs.prepare-apt-key.outputs.signing-available == 'true' && ',apt-source' || '' }},qwen3-embedding

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download apt archive public key
        if: needs.prepare-apt-key.outputs.signing-available == 'true'
        uses: actions/download-artifact@v4
        with:
          name: claw-os-apt-public-key
          path: packaging/apt-repo

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl,aarch64-unknown-linux-gnu

      - name: Install host build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y musl-tools debootstrap curl ca-certificates python3 gnupg

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-build-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-build-

      - name: Build cos binary (arm64 musl)
        run: cargo build --release -p cos --target aarch64-unknown-linux-musl

      - name: Build cos-browser binary (arm64 gnu)
        run: cargo build --release -p cos-browser --target aarch64-unknown-linux-gnu

      - name: Build claw-semantic binaries (arm64 gnu)
        run: cargo build --release -p claw-semantic --target aarch64-unknown-linux-gnu

      - name: Build arm64 headless rootfs
        run: sudo ARCH=arm64 ./rootfs/build.sh --features "$ROOTFS_FEATURES"

      - name: Stage rootfs for Docker (cos user + overlay scratch dirs)
        run: |
          sudo bash -c '
            set -euo pipefail
            export ROOTFS="$PWD/build/claw-os-rootfs"
            export DOCKER_ROOTFS="$PWD/build/claw-os-docker-rootfs-arm64"
            export DOCKER_UPPER="$PWD/build/.claw-os-docker-upper-arm64"
            export DOCKER_WORK="$PWD/build/.claw-os-docker-work-arm64"
            export PROJECT_DIR="$PWD"
            mountpoint -q "$DOCKER_ROOTFS" 2>/dev/null && umount "$DOCKER_ROOTFS" || true
            rm -rf "$DOCKER_ROOTFS" "$DOCKER_UPPER" "$DOCKER_WORK"
            mkdir -p "$DOCKER_ROOTFS" "$DOCKER_UPPER" "$DOCKER_WORK"
            mount -t overlay overlay \
              -o "lowerdir=$ROOTFS,upperdir=$DOCKER_UPPER,workdir=$DOCKER_WORK" \
              "$DOCKER_ROOTFS"
            source "$PROJECT_DIR/scripts/lib/add-cos-user.sh"
            add_cos_user "$DOCKER_ROOTFS"
            chroot "$DOCKER_ROOTFS" /bin/bash -c "
              set -e
              mkdir -p /var/lib/cos/overlay/base /var/lib/cos/overlay/upper /var/lib/cos/overlay/work
              chown -R cos:cos /var/lib/cos/overlay
            "
          '

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker arm64 image
        env:
          DOCKER_LABELS: ${{ steps.meta.outputs.labels }}
        run: |
          label_args=()
          while IFS= read -r label; do
            [ -n "$label" ] && label_args+=(--label "$label")
          done <<< "$DOCKER_LABELS"
          sudo tar --numeric-owner -cf - \
            targets/docker/Dockerfile build/claw-os-docker-rootfs-arm64 \
            | docker buildx build \
                --platform linux/arm64 \
                --file targets/docker/Dockerfile \
                --build-arg ROOTFS_DIR=build/claw-os-docker-rootfs-arm64 \
                --tag "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-arm64" \
                "${label_args[@]}" --push -

      - name: Remove Docker arm64 staging
        if: always()
        run: |
          sudo umount build/claw-os-docker-rootfs-arm64 2>/dev/null || true
          sudo rm -rf build/claw-os-docker-rootfs-arm64 \
            build/.claw-os-docker-upper-arm64 build/.claw-os-docker-work-arm64
          docker buildx prune --all --force || true

      - name: Package WSL arm64 rootfs tarball
        run: sudo ARCH=arm64 FEATURES="$ROOTFS_FEATURES" ./targets/wsl/build.sh

      - name: Fix build/ ownership for non-sudo steps
        run: sudo chown -R "$(id -u):$(id -g)" build

      - name: Upload arm64 .deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: claw-os-debs-arm64
          path: build/debs/*.deb
          if-no-files-found: error

      - name: Compute SHA-256 for WSL arm64 artifact
        id: artifact
        run: |
          cd build
          sha256sum claw-os-wsl-arm64.tar.gz > claw-os-wsl-arm64.tar.gz.sha256
          SHA=$(cut -d' ' -f1 claw-os-wsl-arm64.tar.gz.sha256)
          SIZE=$(du -h claw-os-wsl-arm64.tar.gz | cut -f1)
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "## Claw OS WSL arm64 build" >> "$GITHUB_STEP_SUMMARY"
          echo "- File: \`claw-os-wsl-arm64.tar.gz\` ($SIZE)" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA-256: \`$SHA\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload WSL arm64 tarball as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: claw-os-wsl-arm64
          path: |
            build/claw-os-wsl-arm64.tar.gz
            build/claw-os-wsl-arm64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 90

  publish-docker-image:
    needs: [build-amd64, build-arm64]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Publish multi-arch Docker manifest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          SOURCE_AMD64: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-amd64
          SOURCE_ARM64: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-arm64
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            echo ":: publishing $tag"
            docker buildx imagetools create \
              --tag "$tag" \
              "$SOURCE_AMD64" \
              "$SOURCE_ARM64"
          done <<< "$TAGS"

          first_tag="$(printf '%s\n' "$TAGS" | sed -n '1p')"
          docker buildx imagetools inspect "$first_tag"

  publish-wsl-release:
    needs: [build-amd64, build-arm64]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download WSL amd64 artifact
        uses: actions/download-artifact@v4
        with:
          name: claw-os-wsl-amd64
          path: build

      - name: Download WSL arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: claw-os-wsl-arm64
          path: build

      - name: Compute WSL release metadata
        id: artifact
        run: |
          cd build
          for arch in amd64 arm64; do
            sha256sum "claw-os-wsl-${arch}.tar.gz" > "claw-os-wsl-${arch}.tar.gz.sha256"
            sha=$(cut -d' ' -f1 "claw-os-wsl-${arch}.tar.gz.sha256")
            size=$(du -h "claw-os-wsl-${arch}.tar.gz" | cut -f1)
            echo "${arch}_sha=$sha" >> "$GITHUB_OUTPUT"
            echo "${arch}_size=$size" >> "$GITHUB_OUTPUT"
            echo "- claw-os-wsl-${arch}.tar.gz ($size): \`$sha\`" >> "$GITHUB_STEP_SUMMARY"
          done

      # Rolling pre-release on every manual run from main, so there is always a
      # stable download URL pointing at the latest build of main:
      #   https://github.com/<org>/<repo>/releases/download/wsl-latest/claw-os-wsl-amd64.tar.gz
      #   https://github.com/<org>/<repo>/releases/download/wsl-latest/claw-os-wsl-arm64.tar.gz
      #
      # action-gh-release does not move an existing tag, so we delete the
      # previous rolling release + tag first to force the new commit SHA.
      - name: Remove previous rolling release (main only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete wsl-latest --cleanup-tag --yes \
            --repo "${GITHUB_REPOSITORY}" || true

      - name: Publish rolling pre-release (main only)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: wsl-latest
          name: WSL rolling build (main)
          prerelease: true
          target_commitish: ${{ github.sha }}
          body: |
            Rolling build of `main` for WSL2 import on Windows.

            **Commit:** ${{ github.sha }}

            | Architecture | File | SHA-256 | Size |
            |---|---|---|---|
            | amd64 | `claw-os-wsl-amd64.tar.gz` | `${{ steps.artifact.outputs.amd64_sha }}` | ${{ steps.artifact.outputs.amd64_size }} |
            | arm64 | `claw-os-wsl-arm64.tar.gz` | `${{ steps.artifact.outputs.arm64_sha }}` | ${{ steps.artifact.outputs.arm64_size }} |

            ## Install on Windows
            ```powershell
            # Download the tarball matching your Windows CPU architecture:
            #   x64 Windows:       claw-os-wsl-amd64.tar.gz
            #   Windows on ARM64:  claw-os-wsl-arm64.tar.gz
            $tarball = if ($env:PROCESSOR_ARCHITECTURE -eq "ARM64") { ".\claw-os-wsl-arm64.tar.gz" } else { ".\claw-os-wsl-amd64.tar.gz" }
            wsl --import claw-os C:\WSL\claw-os $tarball --version 2
            wsl -d claw-os
            ```

            Or use the helper script: `targets/wsl/install.ps1`
          files: |
            build/claw-os-wsl-amd64.tar.gz
            build/claw-os-wsl-amd64.tar.gz.sha256
            build/claw-os-wsl-arm64.tar.gz
            build/claw-os-wsl-arm64.tar.gz.sha256

      # Versioned release on a manually selected v* tag.
      - name: Publish versioned release (tag run)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Claw OS ${{ github.ref_name }}
          body: |
            Claw OS ${{ github.ref_name }} — WSL2 importable rootfs tarballs.

            | Architecture | File | SHA-256 | Size |
            |---|---|---|---|
            | amd64 | `claw-os-wsl-amd64.tar.gz` | `${{ steps.artifact.outputs.amd64_sha }}` | ${{ steps.artifact.outputs.amd64_size }} |
            | arm64 | `claw-os-wsl-arm64.tar.gz` | `${{ steps.artifact.outputs.arm64_sha }}` | ${{ steps.artifact.outputs.arm64_size }} |

            ## Install on Windows
            ```powershell
            $tarball = if ($env:PROCESSOR_ARCHITECTURE -eq "ARM64") { ".\claw-os-wsl-arm64.tar.gz" } else { ".\claw-os-wsl-amd64.tar.gz" }
            wsl --import claw-os C:\WSL\claw-os $tarball --version 2
            wsl -d claw-os
            ```
          files: |
            build/claw-os-wsl-amd64.tar.gz
            build/claw-os-wsl-amd64.tar.gz.sha256
            build/claw-os-wsl-arm64.tar.gz
            build/claw-os-wsl-arm64.tar.gz.sha256

  build-apt-repo:
    needs: [prepare-apt-key, build-amd64, build-arm64]
    if: |
      github.event_name != 'pull_request'
      && github.ref == 'refs/heads/main'
      && needs.prepare-apt-key.outputs.signing-available == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download amd64 .deb artifacts
        uses: actions/download-artifact@v4
        with:
          name: claw-os-debs-amd64
          path: build/debs

      - name: Download arm64 .deb artifacts
        uses: actions/download-artifact@v4
        with:
          name: claw-os-debs-arm64
          path: build/debs

      - name: Build apt repo from multi-arch .debs
        env:
          CLAW_OS_APT_SIGNING_PRIVATE_KEY: ${{ secrets.CLAW_OS_APT_SIGNING_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.CLAW_OS_APT_SIGNING_PASSPHRASE }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq apt-utils gnupg
          if [ -z "$CLAW_OS_APT_SIGNING_PRIVATE_KEY" ]; then
            echo "CLAW_OS_APT_SIGNING_PRIVATE_KEY is required" >&2
            exit 1
          fi
          export GNUPGHOME="$RUNNER_TEMP/claw-os-apt-gnupg"
          trap 'rm -rf "$GNUPGHOME"' EXIT
          mkdir -m 700 -p "$GNUPGHOME"
          printf '%s' "$CLAW_OS_APT_SIGNING_PRIVATE_KEY" | gpg --batch --import
          GPG_KEY_ID="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "sec" { print $5; exit }')"
          test -n "$GPG_KEY_ID"
          export GNUPGHOME GPG_KEY_ID GPG_PASSPHRASE
          ./packaging/apt-repo/build-repo.sh

      - name: Upload apt repo as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/apt-repo

  # Publish the apt repo (build/apt-repo) to GitHub Pages.
  # Repo settings → Pages → Source must be set to "GitHub Actions" for the
  # deployment to succeed. The artifact is uploaded by the `build-apt-repo` job.
  publish-apt-repo:
    needs: build-apt-repo
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
