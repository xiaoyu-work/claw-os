name: Build and Publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
          components: clippy, rustfmt

      - name: Install musl tools
        run: sudo apt-get update -qq && sudo apt-get install -y musl-tools

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      - name: Clippy lint (cos)
        run: cd core && cargo clippy --target x86_64-unknown-linux-musl -- -D warnings 2>&1 || true

      - name: Run cos tests
        # `--test-threads=1` because many tests in `cos` mutate process-wide
        # env vars (`COS_DATA_DIR`, `COS_SESSION`, `COS_PERMS_MODE`, …).
        # Each module guards its own state with a per-module `Mutex<()>`,
        # but the env vars themselves are shared, so two modules racing on
        # separate locks still trample each other. Running serially is the
        # cheapest fix; the test binary still finishes in ~15s.
        run: cd core && cargo test -- --test-threads=1

      - name: Run cos-browser tests
        run: cargo test -p cos-browser

  # Single rootfs, multiple distribution channels.
  #
  # The rootfs is built once with the feature set shared by the Docker image
  # and the WSL tarball (`base,cos-core,browser,systemd,apt-source`). Down-
  # stream steps in this job then package that one rootfs into:
  #   - 1 Docker image                  → GHCR
  #   - 1 WSL tarball                   → GitHub Release
  #   - .deb packages + apt repo        → GH Pages
  #
  # Previously this work was split between `build` (Docker + .deb) and a
  # separate `release-wsl` job that re-debootstrapped and re-built the cos
  # binaries. That duplicated ~15min of CI work and meant the two channels
  # could drift if the feature lists fell out of sync. Consolidating means
  # the WSL artifact now requires `test` to pass (acceptable trade-off).
  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write  # WSL release publishing
      packages: write  # Docker push to GHCR

    steps:
      - uses: actions/checkout@v5

      # cos (musl, static) and cos-browser (gnu, V8 needs glibc).
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,x86_64-unknown-linux-gnu

      - name: Install host build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y musl-tools debootstrap

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      - name: Build cos binary (musl)
        run: cargo build --release -p cos --target x86_64-unknown-linux-musl

      - name: Build cos-browser binary (gnu)
        run: cargo build --release -p cos-browser --target x86_64-unknown-linux-gnu

      - name: Build cos-agent-bridge binary (musl)
        run: cd desktop/agent && cargo build --release -p cos-agent-bridge --target x86_64-unknown-linux-musl

      # Build the rootfs ONCE with the WSL feature set. The Docker image and
      # WSL tarball both consume this same tree.
      - name: Build rootfs (shared with Docker + WSL)
        run: sudo ./rootfs/build.sh --features base,cos-core,browser,systemd,apt-source

      - name: Fix rootfs permissions for Docker build
        run: sudo chmod -R a+rX build/claw-os-rootfs

      # Docker-specific prep on the shared rootfs:
      #   - Add the default `cos` user (uid 1000, NOPASSWD sudo).
      #   - Pre-create /var/lib/cos/overlay/{base,upper,work} chowned to cos
      #     so cos-init (PID 1) can run as non-root inside the container.
      # Both steps are idempotent; targets/wsl/build.sh below re-runs the
      # user add as a no-op when it sees the user already exists.
      - name: Prep rootfs for Docker (cos user + overlay scratch dirs)
        run: |
          sudo bash -c '
            set -euo pipefail
            export ROOTFS="$PWD/build/claw-os-rootfs"
            export PROJECT_DIR="$PWD"
            source "$PROJECT_DIR/scripts/lib/add-cos-user.sh"
            add_cos_user "$ROOTFS"
            chroot "$ROOTFS" /bin/bash -c "
              set -e
              mkdir -p /var/lib/cos/overlay/base /var/lib/cos/overlay/upper /var/lib/cos/overlay/work
              chown -R cos:cos /var/lib/cos/overlay
            "
          '

      # Docker build (FROM scratch — no base image)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: targets/docker/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # WSL packaging — same rootfs we just shipped to Docker, plus the
      # WSL-specific overlay (/etc/wsl.conf). targets/wsl/build.sh detects
      # the existing rootfs and skips the rootfs rebuild.
      - name: Package WSL rootfs tarball
        run: sudo ./targets/wsl/build.sh

      - name: Fix build/ ownership for non-sudo steps
        run: sudo chown -R "$(id -u):$(id -g)" build

      - name: Upload .deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: claw-os-debs
          path: build/debs/*.deb
          if-no-files-found: error

      - name: Compute SHA-256 and rename for release
        id: artifact
        run: |
          cd build
          sha256sum claw-os-wsl-amd64.tar.gz > claw-os-wsl-amd64.tar.gz.sha256
          SHA=$(cut -d' ' -f1 claw-os-wsl-amd64.tar.gz.sha256)
          SIZE=$(du -h claw-os-wsl-amd64.tar.gz | cut -f1)
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "## Claw OS WSL build" >> "$GITHUB_STEP_SUMMARY"
          echo "- File: \`claw-os-wsl-amd64.tar.gz\` ($SIZE)" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA-256: \`$SHA\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload WSL tarball as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: claw-os-wsl-amd64
          path: |
            build/claw-os-wsl-amd64.tar.gz
            build/claw-os-wsl-amd64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 90

      # Rolling pre-release on every push to main, so there is always a
      # stable download URL pointing at the latest build of main:
      #   https://github.com/<org>/<repo>/releases/download/wsl-latest/claw-os-wsl-amd64.tar.gz
      #
      # action-gh-release does not move an existing tag, so we delete the
      # previous rolling release + tag first to force the new commit SHA.
      - name: Remove previous rolling release (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete wsl-latest --cleanup-tag --yes \
            --repo "${GITHUB_REPOSITORY}" || true

      - name: Publish rolling pre-release (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: wsl-latest
          name: WSL rolling build (main)
          prerelease: true
          target_commitish: ${{ github.sha }}
          body: |
            Rolling build of `main` for WSL2 import on Windows.

            **Commit:** ${{ github.sha }}
            **SHA-256:** `${{ steps.artifact.outputs.sha256 }}`
            **Size:** ${{ steps.artifact.outputs.size }}

            ## Install on Windows
            ```powershell
            # Download claw-os-wsl-amd64.tar.gz from this release
            wsl --import claw-os C:\WSL\claw-os claw-os-wsl-amd64.tar.gz --version 2
            wsl -d claw-os
            ```

            Or use the helper script: `targets/wsl/install.ps1`
          files: |
            build/claw-os-wsl-amd64.tar.gz
            build/claw-os-wsl-amd64.tar.gz.sha256

      # Versioned release on tag push (v*).
      - name: Publish versioned release (tag push)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Claw OS ${{ github.ref_name }}
          body: |
            Claw OS ${{ github.ref_name }} — WSL2 importable rootfs tarball.

            **SHA-256:** `${{ steps.artifact.outputs.sha256 }}`
            **Size:** ${{ steps.artifact.outputs.size }}

            ## Install on Windows
            ```powershell
            wsl --import claw-os C:\WSL\claw-os claw-os-wsl-amd64.tar.gz --version 2
            wsl -d claw-os
            ```
          files: |
            build/claw-os-wsl-amd64.tar.gz
            build/claw-os-wsl-amd64.tar.gz.sha256

      # apt repo build is the LAST step in this job. By design, a failure
      # here must not block the Docker image push or the WSL release — both
      # have already happened above. The .debs themselves were uploaded as
      # a workflow artifact earlier, so apt repo failure only loses the
      # Pages-served `deb https://…/claw-os` URL, not the .deb files.
      #
      # By this point build/ is fully runner-owned (see "Fix build/
      # ownership" above), so `mkdir build/apt-repo` works without sudo.
      - name: Build apt repo from .debs
        run: |
          sudo apt-get install -y -qq apt-utils
          ./packaging/apt-repo/build-repo.sh

      - name: Upload apt repo as Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/apt-repo

  # Publish the apt repo (build/apt-repo) to GitHub Pages.
  # Repo settings → Pages → Source must be set to "GitHub Actions" for the
  # deployment to succeed. The artifact is uploaded by the `build` job.
  publish-apt-repo:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
