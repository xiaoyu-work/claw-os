name: Build APT repo (.deb packages)

on:
  workflow_dispatch:
    inputs:
      desktop_run_id:
        description: "Optional Build Desktop packages workflow run ID"
        required: false
        default: ""
        type: string
      bootstrap_repository:
        description: "Allow first publication when no existing signed repository exists"
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      desktop_run_id:
        description: "Optional Build Desktop packages workflow run ID"
        required: false
        default: ""
        type: string
      bootstrap_repository:
        description: "Allow first publication when no existing signed repository exists"
        required: false
        default: false
        type: boolean

concurrency:
  group: claw-os-apt-pages
  cancel-in-progress: false

# The .debs are assembled from already-compiled binaries plus source-tree
# files (see packaging/README.md) — no rootfs, debootstrap or chroot needed.
# That is why this pipeline only builds the Rust binaries and then runs
# packaging/deb/build-debs.sh, rather than waiting on an OS image build.
jobs:
  build-debs:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            rust_targets: x86_64-unknown-linux-musl,x86_64-unknown-linux-gnu
            musl_target: x86_64-unknown-linux-musl
            gnu_target: x86_64-unknown-linux-gnu
          - arch: arm64
            runner: ubuntu-24.04-arm
            rust_targets: aarch64-unknown-linux-musl,aarch64-unknown-linux-gnu
            musl_target: aarch64-unknown-linux-musl
            gnu_target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    env:
      ARCH: ${{ matrix.arch }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # package_version() derives the version from commit count

      # cos (musl, static) and cos-browser (gnu, V8 needs glibc).
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Install host build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y musl-tools dpkg-dev fakeroot

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-build-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-build-

      - name: Build cos binary (musl)
        run: cargo build --release -p cos --target ${{ matrix.musl_target }}

      - name: Build cos-browser binary (gnu)
        run: cargo build --release -p cos-browser --target ${{ matrix.gnu_target }}

      - name: Build claw-semantic binaries (gnu)
        run: cargo build --release -p claw-semantic --target ${{ matrix.gnu_target }}

      - name: Build ${{ matrix.arch }} .deb packages
        run: ARCH="$ARCH" ./packaging/deb/build-debs.sh

      - name: Verify package boundaries
        run: |
          agent_deb="$(printf '%s\n' build/debs/claw-os-agent_*_"$ARCH".deb)"
          base_deb="$(printf '%s\n' build/debs/claw-os-base_*_all.deb)"
          test -f "$agent_deb"
          test -f "$base_deb"
          test "$(dpkg-deb -f "$agent_deb" Package)" = "claw-os-agent"
          test "$(dpkg-deb -f "$base_deb" Package)" = "claw-os-base"

          dpkg-deb -c "$agent_deb" > "$RUNNER_TEMP/claw-os-agent.files"
          grep -q './usr/local/bin/cos$' "$RUNNER_TEMP/claw-os-agent.files"
          grep -q './usr/local/bin/clawd$' "$RUNNER_TEMP/claw-os-agent.files"
          grep -q './usr/local/bin/cos-browser$' "$RUNNER_TEMP/claw-os-agent.files"
          grep -q './usr/local/bin/claw-semantic$' "$RUNNER_TEMP/claw-os-agent.files"
          grep -q './usr/local/bin/claw-semantic-daemon$' "$RUNNER_TEMP/claw-os-agent.files"
          grep -q './usr/lib/cos/apps/web/app.json$' "$RUNNER_TEMP/claw-os-agent.files"
          grep -q './usr/lib/systemd/system/clawd.service$' "$RUNNER_TEMP/claw-os-agent.files"
          ! grep -q 'com.clawos.Agent.desktop' "$RUNNER_TEMP/claw-os-agent.files"
          ! grep -q '/apps/agent/' "$RUNNER_TEMP/claw-os-agent.files"
          ! grep -q '/apps/panel-calendar/' "$RUNNER_TEMP/claw-os-agent.files"

          dpkg-deb -c "$base_deb" > "$RUNNER_TEMP/claw-os-base.files"
          grep -q './usr/local/bin/cos-init$' "$RUNNER_TEMP/claw-os-base.files"
          grep -q './usr/lib/systemd/system/cos-home-setup.service$' "$RUNNER_TEMP/claw-os-base.files"
          ! grep -q './usr/local/bin/cos$' "$RUNNER_TEMP/claw-os-base.files"
          ! grep -q '/usr/lib/cos/apps/' "$RUNNER_TEMP/claw-os-base.files"

      - name: Install Agent package on Ubuntu
        run: |
          agent_deb="$(printf '%s\n' build/debs/claw-os-agent_*_"$ARCH".deb)"
          sudo apt-get install -y --no-install-recommends "$PWD/$agent_deb"

          for attempt in {1..30}; do
            if sudo systemctl is-active --quiet clawd.service \
                && sudo test -S /run/cos/clawd.sock; then
              break
            fi
            sleep 1
          done
          sudo systemctl is-active --quiet clawd.service
          sudo test -S /run/cos/clawd.sock
          /usr/local/bin/cos-browser --help >/dev/null
          sudo python3 - <<'PY'
          import json
          import socket

          client = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
          client.connect("/run/cos/clawd.sock")
          client.sendall(b'{"id":1,"command":"daemon.health","params":{}}\n')
          response = json.loads(client.makefile("r", encoding="utf-8").readline())
          assert response["ok"] is True, response
          assert response["result"]["daemon"] == "clawd", response
          PY

      - name: Upload ${{ matrix.arch }} .deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: claw-os-debs-${{ matrix.arch }}
          path: build/debs/*.deb
          if-no-files-found: error

  # Assembles the signed multi-arch repo. Skipped (not failed) when the
  # signing secret is absent, so forks never publish an unsigned repo.
  build-repo:
    needs: build-debs
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      signed: ${{ steps.detect.outputs.available }}
    steps:
      - uses: actions/checkout@v5

      - name: Detect apt signing key
        id: detect
        env:
          CLAW_OS_APT_SIGNING_PRIVATE_KEY: ${{ secrets.CLAW_OS_APT_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$CLAW_OS_APT_SIGNING_PRIVATE_KEY" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLAW_OS_APT_SIGNING_PRIVATE_KEY is not configured; the apt repo was neither built nor published"
            {
              echo "## Apt repository skipped"
              echo
              echo 'The `CLAW_OS_APT_SIGNING_PRIVATE_KEY` secret is not configured, so the'
              echo 'apt repo was neither built nor published. Set the secret to enable the'
              echo 'signed apt repository.'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download amd64 .deb artifacts
        if: steps.detect.outputs.available == 'true'
        uses: actions/download-artifact@v4
        with:
          name: claw-os-debs-amd64
          path: build/debs

      - name: Download arm64 .deb artifacts
        if: steps.detect.outputs.available == 'true'
        uses: actions/download-artifact@v4
        with:
          name: claw-os-debs-arm64
          path: build/debs

      - name: Download newly built desktop packages
        if: steps.detect.outputs.available == 'true' && inputs.desktop_run_id != ''
        uses: actions/download-artifact@v4
        with:
          pattern: claw-os-desktop-*
          path: build/debs
          merge-multiple: true
          run-id: ${{ inputs.desktop_run_id }}
          github-token: ${{ github.token }}

      - name: Build apt repo from multi-arch .debs
        if: steps.detect.outputs.available == 'true'
        env:
          CLAW_OS_APT_SIGNING_PRIVATE_KEY: ${{ secrets.CLAW_OS_APT_SIGNING_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.CLAW_OS_APT_SIGNING_PASSPHRASE }}
          ALLOW_MISSING_EXISTING_REPO: ${{ inputs.bootstrap_repository && '1' || '0' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq apt-utils gnupg
          export GNUPGHOME="$RUNNER_TEMP/claw-os-apt-gnupg"
          trap 'rm -rf "$GNUPGHOME"' EXIT
          mkdir -m 700 -p "$GNUPGHOME"
          printf '%s' "$CLAW_OS_APT_SIGNING_PRIVATE_KEY" | gpg --batch --import
          GPG_KEY_ID="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "sec" { print $5; exit }')"
          test -n "$GPG_KEY_ID"
          export GNUPGHOME GPG_KEY_ID GPG_PASSPHRASE
          gpg --batch --export "$GPG_KEY_ID" > "$RUNNER_TEMP/claw-os-existing-repo.gpg"
          EXISTING_APT_REPO_URL="https://xiaoyu-work.github.io/claw-os" \
            APT_PUBLIC_KEYRING="$RUNNER_TEMP/claw-os-existing-repo.gpg" \
            ALLOW_MISSING_EXISTING_REPO="$ALLOW_MISSING_EXISTING_REPO" \
            ./packaging/apt-repo/preserve-desktop.sh

          base_deb="$(printf '%s\n' build/debs/claw-os-base_*_all.deb)"
          base_version="$(dpkg-deb -f "$base_deb" Version)"
          for desktop_deb in build/debs/claw-os-desktop_*.deb; do
            [ -e "$desktop_deb" ] || continue
            desktop_version="$(dpkg-deb -f "$desktop_deb" Version)"
            if ! dpkg --compare-versions "$base_version" ge "$desktop_version"; then
              echo "error: desktop $desktop_version requires a newer base than $base_version" >&2
              exit 1
            fi
          done

          ./packaging/apt-repo/build-repo.sh

      - name: Upload apt repo as Pages artifact
        if: steps.detect.outputs.available == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/apt-repo

  # Publish the apt repo to GitHub Pages.
  # Repo settings → Pages → Source must be set to "GitHub Actions" for the
  # deployment to succeed. The artifact is uploaded by the `build-repo` job.
  publish-to-github-pages:
    needs: build-repo
    if: github.ref == 'refs/heads/main' && needs.build-repo.outputs.signed == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
