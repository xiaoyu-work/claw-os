name: Release

# Umbrella pipeline: runs the test suite, then fans out to the two
# independent distribution channels. Each of the called workflows can also
# be run on its own from the Actions tab when you only need one artifact.
on:
  workflow_dispatch:

jobs:
  test:
    uses: ./.github/workflows/test.yml

  images:
    needs: test
    uses: ./.github/workflows/build-images.yml
    permissions:
      contents: write   # WSL rolling release
      packages: write   # Docker push to GHCR
    secrets: inherit

  apt:
    needs: test
    uses: ./.github/workflows/build-apt.yml
    permissions:
      contents: read
      pages: write
      id-token: write
    secrets: inherit
