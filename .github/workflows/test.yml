name: Test (clippy + cargo test + pytest)

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Validate image provisioning scripts
        run: |
          set -euo pipefail
          scripts=(
            scripts/lib/image-identity.sh
            targets/docker/build.sh
            targets/docker/container-entrypoint.sh
            targets/wsl/build.sh
            targets/wsl/overlay/usr/lib/cos/init/wsl-oobe
          )
          for script in "${scripts[@]}"; do
            bash -n "$script"
          done
          if grep -Il $'\r' "${scripts[@]}"; then
            echo "Bash provisioning scripts must use LF line endings" >&2
            exit 1
          fi

      - name: Test APT package synchronization
        run: bash packaging/apt-repo/tests/test-sync-existing-packages.sh

      - name: Test release-security publication
        run: bash packaging/apt-repo/tests/test-release-security-publication.sh

      - name: Test managed-home package removal
        run: bash packaging/deb/tests/test-remove-home-overlay.sh

      - name: Test agent worker packaging contract
        run: bash packaging/deb/tests/test-agentd-packaging.sh

      - name: Test session journal packaging contract
        run: bash packaging/deb/tests/test-session-journal-packaging.sh

      - name: Test worker sandbox packaging contract
        run: bash packaging/deb/tests/test-worker-sandbox-packaging.sh

      # Every App operation, GUI surface, MCP server and adapter runs
      # inside bubblewrap, and the launcher fails closed without it. The
      # runner image does not ship it, so it is installed here — and
      # `COS_WORKER_SANDBOX_REQUIRED` makes the isolation suite *fail*
      # rather than skip if it is somehow still unavailable, so a
      # missing dependency cannot turn those tests into a no-op.
      - name: Install worker sandbox dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends bubblewrap

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      # Lint on the host target so clippy shares its dependency build with
      # `cargo test` below. Building this step for musl instead compiled all
      # ~530 dependency crates a second time into
      # `target/x86_64-unknown-linux-musl/` for no extra signal: the only
      # target-conditional code in the crate is the `RlimitResource` type
      # alias in `clawd/crash.rs`, and the image workflows still compile the
      # real musl release binary, so a musl-only break is still caught.
      - name: Clippy lint (cos)
        run: cd core && cargo clippy -- -D warnings

      - name: Run cos tests
        # `--test-threads=1` because many tests in `cos` mutate process-wide
        # env vars (`COS_DATA_DIR`, `COS_SESSION`, `COS_PERMS_MODE`, …).
        # Each module guards its own state with a per-module `Mutex<()>`,
        # but the env vars themselves are shared, so two modules racing on
        # separate locks still trample each other. Running serially is the
        # cheapest fix; the lib test binary finishes in ~70s.
        #
        # `COS_WORKER_SANDBOX_REQUIRED` turns an unavailable worker
        # sandbox into a failure here: the previous step installed the
        # prerequisites, so a skip would mean they are broken rather
        # than absent.
        env:
          COS_WORKER_SANDBOX_REQUIRED: "1"
        run: cd core && cargo test -- --test-threads=1

      - name: Run privileged extension boundaries
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends acl binutils
          cargo build -p cos --bin claw-agentd --bin claw-extension-host
          cargo test -p cos \
            --test agentd_process_boundary \
            --test extension_host_boundary \
            --no-run
          cargo test -p cos --lib --no-run

          readonly root=/opt/cos-boundary-tests
          sudo install -d -o root -g root -m 0755 "$root"
          cleanup() {
            sudo rm -rf -- "$root"
          }
          trap cleanup EXIT

          agentd_test=$(find target/debug/deps -maxdepth 1 -type f -perm -u+x \
            -name 'agentd_process_boundary-*' ! -name '*.d' -printf '%T@ %p\n' |
            sort -nr | head -n1 | cut -d' ' -f2-)
          extension_test=$(find target/debug/deps -maxdepth 1 -type f -perm -u+x \
            -name 'extension_host_boundary-*' ! -name '*.d' -printf '%T@ %p\n' |
            sort -nr | head -n1 | cut -d' ' -f2-)
          lib_test=
          while IFS= read -r candidate; do
            if "$candidate" --list 2>/dev/null |
              grep '^extension_host::child_isolation::tests::' >/dev/null; then
              lib_test=$candidate
              break
            fi
          done < <(find target/debug/deps -maxdepth 1 -type f -perm -u+x \
            -name 'cos-*' ! -name '*.d' ! -name '*.rlib' ! -name '*.rmeta' \
            -printf '%T@ %p\n' | sort -nr | cut -d' ' -f2-)
          test -n "$agentd_test"
          test -n "$extension_test"
          test -n "$lib_test"
          mapfile -t privileged_child_tests < <(
            "$lib_test" --list |
              sed -n 's/^\(extension_host::child_isolation::tests::[^:]*\): test$/\1/p'
          )
          readonly expected_privileged_child_tests=19
          if [ "${#privileged_child_tests[@]}" -ne "$expected_privileged_child_tests" ]; then
            printf 'expected %s privileged child tests, found %s\n' \
              "$expected_privileged_child_tests" "${#privileged_child_tests[@]}" >&2
            printf '%s\n' "${privileged_child_tests[@]}" >&2
            exit 1
          fi

          sudo install -o root -g root -m 0755 \
            target/debug/claw-agentd "$root/claw-agentd"
          sudo install -o root -g root -m 0755 \
            target/debug/claw-extension-host "$root/claw-extension-host"
          sudo install -o root -g root -m 0755 \
            "$agentd_test" "$root/agentd_process_boundary"
          sudo install -o root -g root -m 0755 \
            "$extension_test" "$root/extension_host_boundary"
          sudo install -o root -g root -m 0755 \
            "$lib_test" "$root/cos_lib_tests"
          sudo install -o root -g root -m 0755 \
            packaging/deb/claw-os-agent/extension-gid-scan.py \
            "$root/extension-gid-scan.py"
          sudo install -o root -g root -m 0755 \
            packaging/deb/tests/test-extension-gid-scan.py \
            "$root/test-extension-gid-scan.py"

          sudo env \
            HOME=/root \
            SUDO_UID="$(id -u)" \
            COS_PRIVILEGED_EXTENSION_HOST_BIN="$root/claw-extension-host" \
            "$root/agentd_process_boundary" --test-threads=1
          sudo env \
            HOME=/root \
            SUDO_UID="$(id -u)" \
            COS_PRIVILEGED_EXTENSION_HOST_BIN="$root/claw-extension-host" \
            "$root/extension_host_boundary" --test-threads=1
          sudo env \
            HOME=/root \
            SUDO_UID="$(id -u)" \
            COS_REQUIRE_PRIVILEGED_CHILD_TESTS=1 \
            "$root/cos_lib_tests" extension_host::child_isolation::tests \
            --test-threads=1
          sudo env \
            HOME=/root \
            COS_GID_SCAN_HELPER_SOURCE="$root/extension-gid-scan.py" \
            /usr/bin/python3 "$root/test-extension-gid-scan.py"

      # Downgrade protection is exercised against real .deb archives,
      # real maintainer scripts, real dpkg/apt transactions and real
      # OpenPGP signatures. The signing keys are generated inside the
      # tests and discarded with them, so these steps need no secret.
      - name: Test update downgrade protection packaging
        run: |
          cd core && cargo build --bin claw-security-floor
          cd "$GITHUB_WORKSPACE"
          COS_SECURITY_FLOOR_BIN="$GITHUB_WORKSPACE/target/debug/claw-security-floor" \
            bash packaging/deb/tests/test-security-floor-packaging.sh

      - name: Test update downgrade protection installation
        run: |
          COS_SECURITY_FLOOR_BIN="$GITHUB_WORKSPACE/target/debug/claw-security-floor" \
            bash packaging/deb/tests/test-security-floor-install.sh

      - name: Run cos-browser tests
        run: cargo test -p cos-browser

      - name: Install Python test dependencies
        run: python3 -m pip install --disable-pip-version-check pytest

      - name: Run Python tests
        env:
          PYTHONPATH: claw-os-sdk/python/src:cos-runtime/python/src
        run: python3 -m pytest -q apps adapters claw-os-sdk/python/src cos-runtime/python/src
