name: Test (clippy + cargo test + pytest)

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      app_source_artifact:
        description: "Same-run immutable App snapshot prepared by release.yml"
        required: false
        default: ""
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate image provisioning scripts
        run: bash scripts/ci/check-provisioning.sh

      - name: Prepare disposable hosted-runner DNS
        run: bash scripts/ci/prepare-network.sh

      - name: Install APT validation tools
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends apt-utils gnupg

      - name: Test APT package synchronization
        run: bash packaging/apt-repo/tests/test-sync-existing-packages.sh

      - name: Test release-security publication
        run: bash packaging/apt-repo/tests/test-release-security-publication.sh

      - name: Test managed-home package removal
        run: bash packaging/deb/tests/test-remove-home-overlay.sh

      - name: Test agent worker packaging contract
        run: bash packaging/deb/tests/test-agentd-packaging.sh

      - name: Test session journal packaging contract
        run: bash packaging/deb/tests/test-session-journal-packaging.sh

      - name: Test worker sandbox packaging contract
        run: bash packaging/deb/tests/test-worker-sandbox-packaging.sh

      # Every App operation, GUI surface, MCP server and adapter runs
      # inside bubblewrap, and the launcher fails closed without it. The
      # runner image does not ship it, so it is installed here — and
      # `COS_WORKER_SANDBOX_REQUIRED` makes the isolation suite *fail*
      # rather than skip if it is somehow still unavailable, so a
      # missing dependency cannot turn those tests into a no-op.
      - name: Install worker sandbox dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends bubblewrap python3-idna python3-apt openssl libpam0g-dev dbus-daemon iproute2

      - name: Pin Cargo cache identity before private fixtures
        id: cargo-inputs
        env:
          CARGO_INPUTS: ${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
        run: printf 'hash=%s\n' "$CARGO_INPUTS" >> "$GITHUB_OUTPUT"

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-nodebug-${{ steps.cargo-inputs.outputs.hash }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-nodebug-
            ${{ runner.os }}-cargo-display-nodebug-${{ steps.cargo-inputs.outputs.hash }}

      # Lint on the host target so clippy shares its dependency build with
      # `cargo test` below. Building this step for musl instead compiled all
      # ~530 dependency crates a second time into
      # `target/x86_64-unknown-linux-musl/` for no extra signal: the only
      # target-conditional code in the crate is the `RlimitResource` type
      # alias in `clawd/crash.rs`, and the image workflows still compile the
      # real musl release binary, so a musl-only break is still caught.
      - name: Clippy lint (cos)
        run: cd core && cargo clippy -- -D warnings

      - name: Download prepared release inputs
        if: inputs.app_source_artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.app_source_artifact }}
          path: build/release

      - name: Resolve App main into immutable test inputs
        env:
          APP_SOURCE_ARTIFACT: ${{ inputs.app_source_artifact }}
        run: |
          if [ -n "$APP_SOURCE_ARTIFACT" ]; then
            export CLAW_APP_SOURCE_LOCK="$GITHUB_WORKSPACE/build/release/app-sources.json"
            echo "CLAW_APP_SOURCE_LOCK=$CLAW_APP_SOURCE_LOCK" >> "$GITHUB_ENV"
          fi
          python3 scripts/app_sources.py

      - name: Run privileged extension boundaries
        run: bash scripts/ci/test-boundaries.sh extensions

      - name: Run cos tests
        # `--test-threads=1` because many tests in `cos` mutate process-wide
        # env vars (`COS_DATA_DIR`, `COS_SESSION`, `COS_PERMS_MODE`, …).
        # Each module guards its own state with a per-module `Mutex<()>`,
        # but the env vars themselves are shared, so two modules racing on
        # separate locks still trample each other. Running serially is the
        # cheapest fix; the lib test binary finishes in ~70s.
        #
        # `COS_WORKER_SANDBOX_REQUIRED` turns an unavailable worker
        # sandbox into a failure here: the previous step installed the
        # prerequisites, so a skip would mean they are broken rather
        # than absent.
        env:
          COS_WORKER_SANDBOX_REQUIRED: "1"
        run: cd core && cargo test -- --test-threads=1

      - name: Test ordinary App bind gate
        run: bash scripts/ci/test-boundaries.sh app-bind

      - name: Test official App APT delivery and protected plan custody
        run: bash scripts/ci/test-boundaries.sh app-apt

      - name: Test nearby transport and owner-file boundaries without wireless hardware
        run: bash scripts/ci/test-boundaries.sh nearby

      - name: Test owner-scoped Calendar reads
        run: bash scripts/ci/test-boundaries.sh calendar

      # Downgrade protection is exercised against real .deb archives,
      # real maintainer scripts, real dpkg/apt transactions and real
      # OpenPGP signatures. The signing keys are generated inside the
      # tests and discarded with them, so these steps need no secret.
      - name: Test update downgrade protection packaging
        run: |
          cd core && cargo build --bin claw-security-floor
          cd "$GITHUB_WORKSPACE"
          COS_SECURITY_FLOOR_BIN="$GITHUB_WORKSPACE/target/debug/claw-security-floor" \
            bash packaging/deb/tests/test-security-floor-packaging.sh

      - name: Test update downgrade protection installation
        run: |
          COS_SECURITY_FLOOR_BIN="$GITHUB_WORKSPACE/target/debug/claw-security-floor" \
            bash packaging/deb/tests/test-security-floor-install.sh

      - name: Run cos-browser tests
        run: cargo test -p cos-browser

      - name: Run App data SDK and provider contracts
        run: bash scripts/ci/test-boundaries.sh applets

      - name: Install Python test dependencies
        run: python3 -m pip install --disable-pip-version-check pytest

      - name: Run Python tests
        env:
          PYTHONPATH: claw-os-sdk/python/src:cos-runtime/python/src
          CLAW_APPLET_TEST_BINARY: ${{ github.workspace }}/target/debug/claw-os-applet-provider
        run: >-
          python3 -m pytest -q adapters claw-os-sdk/python/src cos-runtime/python/src
          packaging/deb/tests/test_app_sources.py rootfs/features/claw-mail-ai/test_install.py
          scripts/tests/test_app_platform.py packaging/deb/tests/test_applet_provider.py
          scripts/tests/test_native_editor_payload.py core/tests/test_app_apt_metadata.py

      - name: Retain matching Linux acceptance executables
        if: always()
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, tarfile
          root = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          selected = set()
          helpers = {
              "cos", "claw-agentd", "claw-extension-host", "claw-app-runner",
              "claw-app-apt-hook", "claw-file-manager",
              "extension_host_boundary", "agentd_process_boundary",
          }
          for report in pathlib.Path(os.environ["RUNNER_TEMP"]).glob("*-tests.jsonl"):
              for line in report.read_text().splitlines():
                  row = json.loads(line)
                  if (row.get("reason") == "compiler-artifact" and row.get("executable")
                          and row.get("target", {}).get("name") in helpers):
                      selected.add(pathlib.Path(row["executable"]))
          records = []
          output = root / "build/linux-acceptance"
          output.mkdir(parents=True, exist_ok=True)
          with tarfile.open(output / "executables.tar.gz", "w:gz") as archive:
              for path in sorted(selected):
                  if not path.is_file() or path.is_symlink() or not os.access(path, os.X_OK):
                      continue
                  with path.open("rb") as stream:
                      if stream.read(4) != b"\x7fELF":
                          continue
                      stream.seek(0)
                      digest = hashlib.file_digest(stream, "sha256").hexdigest()
                  archive.add(path, arcname=path.name, recursive=False)
                  records.append({"file": path.name, "size": path.stat().st_size, "sha256": digest})
          (output / "source.json").write_text(json.dumps({
              "revision": os.environ["GITHUB_SHA"], "architecture": os.uname().machine,
              "purpose": "private-validation-only", "files": records,
          }, sort_keys=True, indent=2) + "\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-acceptance-${{ github.sha }}
          path: build/linux-acceptance/*
          if-no-files-found: error
          retention-days: 7

  display-boundaries:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [display, native-fs, file-manager, native-package, native-editor, native-files, native-terminal]
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          lfs: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Prepare disposable hosted-runner DNS
        run: bash scripts/ci/prepare-network.sh
      - name: Install authenticated display fixture dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libpam0g-dev libxkbcommon-dev libwayland-dev \
            bubblewrap python3-idna openssl dbus-daemon iproute2 acl binutils
      - name: Install private native package fixture dependencies
        if: matrix.mode == 'native-package'
        run: |
          sudo apt-get install -y --no-install-recommends apt-utils python3-apt gnupg
      - name: Install real native product build and software-renderer prerequisites
        if: matrix.mode == 'native-editor' || matrix.mode == 'native-files' || matrix.mode == 'native-terminal'
        run: |
          sudo apt-get install -y --no-install-recommends \
            cmake just libfontconfig-dev libfreetype-dev libglib2.0-dev libudev-dev \
            libinput-dev libdbus-1-dev libsystemd-dev libegl-dev libgbm-dev \
            libvulkan1 mesa-vulkan-drivers fonts-dejavu-core
      - name: Pin Cargo cache identity before private fixtures
        id: cargo-inputs
        env:
          CARGO_INPUTS: ${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
        run: printf 'hash=%s\n' "$CARGO_INPUTS" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-display-nodebug-${{ steps.cargo-inputs.outputs.hash }}
          restore-keys: |
            ${{ runner.os }}-cargo-display-nodebug-
            ${{ runner.os }}-cargo-test-nodebug-
      - name: Download prepared release inputs
        if: inputs.app_source_artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.app_source_artifact }}
          path: build/release
      - name: Resolve immutable App fixture inputs
        env:
          APP_SOURCE_ARTIFACT: ${{ inputs.app_source_artifact }}
        run: |
          if [ -n "$APP_SOURCE_ARTIFACT" ]; then
            export CLAW_APP_SOURCE_LOCK="$GITHUB_WORKSPACE/build/release/app-sources.json"
            echo "CLAW_APP_SOURCE_LOCK=$CLAW_APP_SOURCE_LOCK" >> "$GITHUB_ENV"
          fi
          python3 scripts/app_sources.py
      - name: Test authenticated OS display and GUI lifetime
        if: matrix.mode == 'display'
        run: bash scripts/ci/test-boundaries.sh display
      - name: Test real native filesystem selection and retirement
        if: matrix.mode == 'native-fs'
        run: bash scripts/ci/test-boundaries.sh native-fs
      - name: Test FileManager intent delivery from fresh protected state
        if: matrix.mode == 'file-manager'
        run: bash scripts/ci/test-boundaries.sh file-manager
      - name: Test retained package self-handoff through a signed common-Host GUI probe
        if: matrix.mode == 'native-package'
        run: bash scripts/ci/test-boundaries.sh native-package
      - name: Test actual Editor ELF window, independent startup-file read and checked retirement
        if: matrix.mode == 'native-editor'
        run: bash scripts/ci/test-boundaries.sh native-editor
      - name: Test actual Files ELF metadata-only Home window and checked retirement
        if: matrix.mode == 'native-files'
        run: bash scripts/ci/test-boundaries.sh native-files
      - name: Test actual Terminal ELF empty-authority window, private PTY and checked retirement
        if: matrix.mode == 'native-terminal'
        run: bash scripts/ci/test-boundaries.sh native-terminal
      - name: Retain exact native product input and compositor observations
        if: always() && (matrix.mode == 'native-editor' || matrix.mode == 'native-files' || matrix.mode == 'native-terminal')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.mode }}-acceptance-${{ github.sha }}
          path: |
            build/${{ matrix.mode }}-input/app-sources.json
            build/${{ matrix.mode }}-input/${{ matrix.mode }}.json
            build/${{ matrix.mode }}-authenticated.*/${{ matrix.mode }}*.json
          if-no-files-found: error
          retention-days: 7

  sdk-bindings:
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: claw-os-sdk/node/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: claw-os-sdk/go/go.mod
          cache: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify generated public bindings
        run: |
          python3 claw-os-sdk/wire/codegen.py
          git diff --exit-code -- \
            claw-os-sdk/rust/src/generated.rs \
            claw-os-sdk/python/src/claw_os_sdk/generated.py \
            claw-os-sdk/node/src/generated.ts \
            claw-os-sdk/go/generated.go
      - name: Install existing SDK test dependencies
        run: |
          python3 -m pip install --disable-pip-version-check pytest
          npm ci --prefix claw-os-sdk/node
      - name: Test all four public SDK bindings
        run: |
          PYTHONPATH=claw-os-sdk/python/src \
            python3 -m pytest -q claw-os-sdk/python/src
          npm test --prefix claw-os-sdk/node
          cargo test --locked -p claw-os-sdk -- --test-threads=1
          (cd claw-os-sdk/go && go test ./...)

  desktop-sdk-presentation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [notifications, panel, applets]
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - uses: dtolnay/rust-toolchain@stable

      - name: Prepare disposable hosted-runner DNS
        run: bash scripts/ci/prepare-network.sh

      - name: Install existing Desktop build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config git ca-certificates gettext clang libclang-dev \
            libwayland-dev libxkbcommon-dev libegl-dev libgbm-dev libdrm-dev \
            libdbus-1-dev libudev-dev libinput-dev libpulse-dev libpipewire-0.3-dev \
            libfontconfig1-dev libfreetype6-dev libssl-dev

      - name: Cache Desktop cargo inputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-desktop-sdk-${{ matrix.component }}-${{ hashFiles('desktop/applets/Cargo.lock', 'desktop/panel/Cargo.lock', 'claw-os-sdk/rust/notification-presentation/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-desktop-sdk-${{ matrix.component }}-

      - name: Test and build public SDK notification consumer
        if: matrix.component == 'notifications'
        run: |
          tests="$(cargo test --locked --manifest-path desktop/applets/Cargo.toml \
            -p cosmic-applet-notifications --lib -- --list)"
          for name in \
            presentation::tests::popup_mute_requires_confirmation_and_preserves_last_value_on_failure_or_disconnect \
            presentation::tests::rendering_preserves_text_runs_and_independent_row_and_symbolic_group_icons \
            presentation::tests::invalid_image_work_is_rejected_before_render_handle_creation \
            subscriptions::notifications::tests::actual_public_client_requires_negotiation_and_confirmed_preferences_and_actions \
            subscriptions::notifications::tests::incompatible_presenter_never_enables_controls_or_falls_back_to_config
          do
            grep -Fq "$name: test" <<< "$tests" || { echo "missing notification contract: $name" >&2; exit 1; }
          done
          cargo test --locked --manifest-path desktop/applets/Cargo.toml \
            -p cosmic-applet-notifications --lib -- --test-threads=1
          cargo build --locked --manifest-path desktop/applets/Cargo.toml \
            -p cosmic-applet-notifications --bin cosmic-applet-notifications

      - name: Build actual Panel SDK consumer
        if: matrix.component == 'panel'
        run: |
          cargo build --locked --manifest-path desktop/panel/Cargo.toml \
            -p cosmic-panel-bin --bin cosmic-panel

      - name: Build remaining OS applet multiplexor
        if: matrix.component == 'applets'
        run: |
          cargo build --locked --manifest-path desktop/applets/Cargo.toml \
            -p cosmic-applets --bin cosmic-applets
