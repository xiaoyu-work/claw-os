[package]
name = "claw-bridge"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Rust bridge so GUI apps route every fs / exec / pkg / notify call through `cos app <name> <verb>` — making capability gating, audit, and checkpointing apply uniformly to terminal and desktop callers."
repository = "https://github.com/xiaoyu-work/claw-os"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
