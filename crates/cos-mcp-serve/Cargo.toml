[package]
name = "cos-mcp-serve"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/xiaoyu-work/claw-os"
description = "Embeddable MCP (Model Context Protocol) stdio server for Claw OS native Apps"

# This crate is the Rust counterpart to claw-os-sdk/python/src/claw_os_sdk/serve.py: it lets
# any Rust binary (typically a libcosmic GUI App) flip into MCP-server
# mode and expose strict-schema, agent-callable tools backed by its
# own internal logic. The kernel agent spawns the binary with
# `COS_MCP_SERVER=1` and brokers tool calls over stdio JSON-RPC. See
# docs/app-ai-integration.md §12 for the surrounding design.

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt", "sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
