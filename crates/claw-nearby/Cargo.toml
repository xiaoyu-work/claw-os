[package]
name = "claw-nearby"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Isolated OS-owned nearby file transport over Owly"

[workspace]
exclude = ["vendor/owlyd"]

[patch."https://github.com/t4t5/owly"]
owlyd = { path = "vendor/owlyd" }

[[bin]]
name = "claw-nearby-worker"
path = "src/main.rs"

[[bin]]
name = "claw-nearby-radio"
path = "src/radio.rs"

[dependencies]
clawd-client = { path = "../clawd-client" }
owly-airdrop = { git = "https://github.com/t4t5/owly", rev = "7ff594a61e1e158fe56f22b9efb9d8ea88dd918b", features = ["mdns"] }
owly-radio = { git = "https://github.com/t4t5/owly", rev = "7ff594a61e1e158fe56f22b9efb9d8ea88dd918b" }
owlyd = { git = "https://github.com/t4t5/owly", rev = "7ff594a61e1e158fe56f22b9efb9d8ea88dd918b" }
tokio = { version = "1.53.3", features = ["full"] }
serde_json = "1"
rustls = { version = "0.23", default-features = false, features = ["ring","std","tls12"] }
uuid = { version = "1", features = ["v4"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
