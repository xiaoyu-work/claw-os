[package]
name = "owlyd"
description = "The Owly system service: radio leases and the system D-Bus API."
version = "0.4.1"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/t4t5/owly"
publish = false

[workspace]

# The D-Bus API's names and client proxy, for owly-cli and omdrop-owl.
[lib]
path = "src/lib.rs"

[dependencies]
futures-util = { version = "0.3", default-features = false }
nix = { version = "0.31", default-features = false, features = ["signal", "user"] }
owly-radio = { git = "https://github.com/t4t5/owly", rev = "7ff594a61e1e158fe56f22b9efb9d8ea88dd918b" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]
nix = { version = "0.31", default-features = false, features = ["signal"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread"] }
