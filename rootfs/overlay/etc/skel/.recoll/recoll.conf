# ClawOS — default Recoll configuration shipped via /etc/skel
#
# This file is copied to every new user's $HOME/.recoll/ at account
# creation time. Recoll reads it on every recollindex / recollq run.
#
# The companion claw-recoll-index.service (a systemd --user unit) keeps
# recollindex running in monitor mode (recollindex -m), so any file
# created / modified / deleted under the topdirs below is reflected in
# the Xapian index within seconds — no manual reindex needed.
#
# Tweak the user's settings via:
#   recoll                  # GUI: Preferences → Indexing schedule
#   $EDITOR ~/.recoll/recoll.conf
#   cos app docs configure  # AI-facing programmatic surface

# --- What to index ----------------------------------------------------
# Top directories Recoll walks. Tilde and $HOME both expand.
# Add project / source folders here if you want code-search too.
topdirs = ~/Documents ~/Desktop ~/Downloads

# --- What to skip -----------------------------------------------------
# Names matched against every basename in the tree.
skippedNames = .* *~ #* *.bak *.tmp *.swp *.swo *.lock *.pyc *.o *.a *.so \
               *.tar *.gz *.bz2 *.xz *.zip *.7z *.iso *.dmg *.img \
               *.mp4 *.mkv *.mov *.avi *.webm *.flv \
               *.wav *.mp3 *.flac *.ogg *.m4a *.aac \
               node_modules .git .hg .svn .venv venv __pycache__ \
               target build dist out .cache .next .gradle .DS_Store \
               Thumbs.db .Trash .Trash-1000

# Absolute paths recoll must never descend into.
skippedPaths = ~/.recoll ~/.cache ~/.local/share/Trash ~/.local/share/flatpak \
               ~/snap /tmp /var/tmp /proc /sys /dev /run

# --- Indexing behaviour ----------------------------------------------
# Index filenames even if the file content can't be extracted (good
# default — lets you still find a file by its name).
indexallfilenames = 1

# Don't try to extract from files larger than 200 MB — they're typically
# media / disk images and waste cycles.
filemaxmbs = 200

# How often the monitor flushes accumulated changes to the Xapian DB
# (seconds). Lower = faster reflection of edits, more disk activity.
mondelaypatterns = */60

# --- Performance ------------------------------------------------------
# Cap memory used during indexing. 1 GB is plenty for typical homedirs;
# bump for huge corpora.
idxabsmlen = 250
