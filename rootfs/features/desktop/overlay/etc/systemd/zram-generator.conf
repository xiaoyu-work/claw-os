# /etc/systemd/zram-generator.conf — configure the systemd-zram-generator
# unit that ships a kernel-compressed RAM swap device at boot.
#
# Why we ship zram on by default:
#   - Linux without any swap is brutal: a single bloated Electron app
#     plus a browser can push a 16GB laptop into OOM-killer territory
#     during routine use (the kernel cannot evict any anonymous memory
#     because there's nowhere to evict to, so it just shoots processes
#     instead of paging out cold pages).
#   - zram trades a small amount of CPU for ~3x compression on typical
#     desktop workloads (text, code, browser tabs, JSON heaps), so the
#     net effect is +~2x RAM at single-digit CPU cost.
#   - Unlike disk-backed swap, there is no I/O latency cliff — pages
#     stay in RAM, just compressed.
#   - Modern Fedora / Ubuntu / Pop!_OS all ship zram on by default for
#     the same reasons.
#
# Sizing: min(ram, 8GB) is the consensus default. Going above 8GB rarely
# helps because zstd compression starts to bottleneck and you've usually
# hit the real working-set ceiling anyway.
#
# Compression: zstd at default level. ~3x compression ratio for desktop
# workloads with near-zero CPU overhead on any post-2015 CPU.
#
# Priority: 100 (higher than disk swap default of -2), so the kernel
# prefers zram. If the user later adds a swapfile or swap partition
# it'll be used only when zram is saturated.

[zram0]
zram-size = min(ram, 8192)
compression-algorithm = zstd
swap-priority = 100
