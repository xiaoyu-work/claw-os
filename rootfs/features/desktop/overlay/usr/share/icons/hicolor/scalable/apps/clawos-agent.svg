<?xml version="1.0" encoding="UTF-8"?>
<!--
  ClawOS claw mark.

  Geometry is derived from assets/brand/clawos-app-icon-1024.png:
  three strokes at -28 degrees from vertical, bottoms aligned, round
  (true semicircle) caps, trailing dot at the lower right.

  Brand rule: the strokes follow the theme foreground via currentColor
  (black on light, white on dark); the dot is always #005CFE.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" fill="none">
  <g stroke="currentColor" stroke-linecap="round" fill="none">
    <line x1="123.623" y1="69.866" x2="64.000" y2="182.000" stroke-width="18.000"/>
    <line x1="144.497" y1="109.598" x2="106.000" y2="182.000" stroke-width="17.000"/>
    <line x1="170.413" y1="136.087" x2="146.000" y2="182.000" stroke-width="16.000"/>
  </g>
  <circle cx="188.000" cy="184.000" r="10.000" fill="#005CFE"/>
</svg>
