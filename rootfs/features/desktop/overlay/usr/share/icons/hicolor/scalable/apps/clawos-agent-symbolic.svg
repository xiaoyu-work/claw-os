<?xml version="1.0" encoding="UTF-8"?>
<!--
  ClawOS claw mark.

  Geometry is derived from assets/brand/clawos-app-icon-1024.png:
  three strokes at -28 degrees from vertical, bottoms aligned, round
  (true semicircle) caps, trailing dot at the lower right.

  Brand rule: the strokes follow the theme foreground via currentColor
  (black on light, white on dark); the dot is always #005CFE.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <g stroke="currentColor" stroke-linecap="round" fill="none">
    <line x1="30.906" y1="17.466" x2="16.000" y2="45.500" stroke-width="4.500"/>
    <line x1="36.124" y1="27.400" x2="26.500" y2="45.500" stroke-width="4.250"/>
    <line x1="42.603" y1="34.022" x2="36.500" y2="45.500" stroke-width="4.000"/>
  </g>
  <circle cx="47.000" cy="46.000" r="2.500" fill="#005CFE"/>
</svg>
