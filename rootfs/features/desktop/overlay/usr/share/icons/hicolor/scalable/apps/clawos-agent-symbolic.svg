<?xml version="1.0" encoding="UTF-8"?>

<!--
  ClawOS claw mark.

  Geometry is reconstructed from assets/brand/clawos-app-icon-1024.png:
  three strokes at -28 degrees from vertical, bottoms aligned, true
  semicircle caps, and a trailing dot at the lower right.

  Brand rule: the strokes follow the theme foreground through currentColor
  (black on light, white on dark) while the dot is always #005CFE.

  The mark is scaled to the same safe area as the rest of the icon family:
  a 4 px margin inside a 64 px canvas.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <g stroke="currentColor" stroke-linecap="round" fill="none">
    <line x1="30.873" y1="9.456" x2="7.524" y2="53.369" stroke-width="7.049"/>
    <line x1="39.048" y1="25.016" x2="23.972" y2="53.369" stroke-width="6.657"/>
    <line x1="49.197" y1="35.389" x2="39.636" y2="53.369" stroke-width="6.266"/>
  </g>
  <circle cx="56.084" cy="54.152" r="3.916" fill="#005CFE"/>
</svg>
