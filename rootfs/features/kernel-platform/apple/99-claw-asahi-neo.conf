monitor.alsa.rules = [
  {
    matches = [ { api.alsa.path = "hw:AppleJ700AOP,1" } ]
    actions = {
      update-props = {
        node.name = "alsa_input.platform-sound.RawMics"
        node.description = "Raw Mic Device (do not use)"
        node.nick = "RawMics"
      }
    }
  }
  {
    matches = [ { alsa.id = "AppleJ700AOP", alsa.device = 0 } ]
    actions = { update-props = { node.disabled = true } }
  }
  {
    matches = [ { device.name = "~alsa_card.*", api.alsa.card.name = "MacBook Neo J700" } ]
    actions = {
      update-props = {
        device.routes.default-sink-volume = 0.001
        asahi.routes.select-unplugged = true
      }
    }
  }
]

node.software-dsp.rules = [
  {
    matches = [ { api.alsa.path = "hw:AppleJ700,1" } ]
    actions = {
      create-filter = { filter-path = "/usr/share/asahi-audio/j700/graph.json", hide-parent = true }
    }
  }
  {
    matches = [ { api.alsa.path = "hw:AppleJ700AOP,1" } ]
    actions = {
      create-filter = { filter-path = "/usr/share/asahi-audio/j700/mic.json", hide-parent = true }
    }
  }
]

wireplumber.components = [
  {
    name = device/asahi-unplugged-routes.lua, type = script/lua
    provides = custom.asahi-unplugged-routes
    before = [ support.standard-event-source ]
  }
  {
    name = node/asahi-restore-volume.lua, type = script/lua
    provides = hooks.asahi.restore-volume
    before = [ support.standard-event-source ]
  }
]

wireplumber.profiles = {
  main = {
    custom.asahi-unplugged-routes = required
    hooks.asahi.restore-volume = required
  }
}
