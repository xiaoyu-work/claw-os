# unpackfs.conf — copy the live filesystem.squashfs onto the target.
#
# The squashfs lives at /run/live/medium/live/filesystem.squashfs on a
# booted Debian live ISO (live-boot's mount layout). Calamares will mount
# it read-only and rsync the contents to the target's root partition.

unpack:
- source: "/run/live/medium/live/filesystem.squashfs"
  sourcefs: "squashfs"
  destination: ""
