# bootloader.conf — Install GRUB on the freshly-installed target system.
#
# Calamares chroots into the target and runs grub-install + update-grub.
# installEFIFallback writes /EFI/BOOT/BOOTX64.EFI (the firmware fallback
# path), matching what targets/vm/build.sh does for VM images.

efiBootLoader: "grub"
timeout: "5"

# Debian kernels are versioned (`/boot/vmlinuz-<version>` and
# `/boot/initrd.img-<version>`). The GRUB backend discovers them through
# grub-mkconfig; unversioned Arch-style kernel/img fields would point at
# files that do not exist in the installed target.

grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"

installEFIFallback: true
