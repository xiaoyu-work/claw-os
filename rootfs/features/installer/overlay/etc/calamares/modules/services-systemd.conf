# services-systemd.conf — enable / disable services on the installed system.
#
# cos-home-setup.service is already enabled inside the squashfs by the
# claw-os-systemd package. Listing it here is an idempotent installer
# safety net. NetworkManager is enabled independently.

services:
- name: cos-home-setup
  mandatory: false

targets: []

disable: []

mask:
# Live-only services that have no business running on the installed
# system.
- live-config
- live-config.service
