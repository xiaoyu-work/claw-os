# services-systemd.conf — enable / disable services on the installed system.
#
# cos-den-setup.service is already enabled inside the squashfs (the
# claw-os-systemd package's postinst does this), so we don't list it
# again. NetworkManager likewise. Anything live-only is masked.

services:
- name: cos-den-setup
  mandatory: false

targets: []

disable: []

mask:
# Live-only services that have no business running on the installed
# system.
- live-config
- live-config.service
