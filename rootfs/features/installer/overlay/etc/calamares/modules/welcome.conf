# welcome.conf — text shown on the first installer page.

showSupportUrl:        true
showKnownIssuesUrl:    true
showReleaseNotesUrl:   true
showDonateUrl:         false

requirements:
    requiredStorage:    5.0
    requiredRam:        1.0
    internetCheckUrl:   https://example.com/

    check:
    -   storage
    -   ram
    -   power
    -   internet
    -   root
    -   screen

    required:
    -   storage
    -   ram
    -   root
