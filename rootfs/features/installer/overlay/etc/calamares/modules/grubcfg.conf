# grubcfg.conf — keep /etc/default/grub aligned with what the
# grub-disk feature wrote into the rootfs at build time.
#
# Without this overlay Calamares' built-in grubcfg module overwrites
# /etc/default/grub on the target system with its own hardcoded
# defaults (distributor "Debian", 5-second timeout, no quiet/splash),
# which clobbers the Claw OS branding. We instead point grubcfg at
# the same values rootfs/features/grub-disk/install.sh installs into
# /etc/default/grub.d/50-claw-os.cfg, so the post-install grub looks
# identical to a fresh `rootfs/build.sh --features ...grub-disk...`
# build of the same configuration.
#
# Reference: https://github.com/calamares/calamares/blob/calamares/src/modules/grubcfg/grubcfg.conf

# overwrite=false would be ideal here (it would preserve the dropin
# we placed in /etc/default/grub.d/) but the Calamares module unconditionally
# rewrites /etc/default/grub from this map. So we explicitly mirror
# the dropin's values to keep both files coherent.
overwrite: true

defaults:
    GRUB_TIMEOUT: "2"
    GRUB_TIMEOUT_STYLE: "menu"
    GRUB_DISTRIBUTOR: "Claw OS"
    GRUB_CMDLINE_LINUX_DEFAULT: "\"quiet splash\""
    GRUB_CMDLINE_LINUX: "\"\""
    GRUB_DISABLE_OS_PROBER: "true"
    GRUB_RECORDFAIL_TIMEOUT: "2"
