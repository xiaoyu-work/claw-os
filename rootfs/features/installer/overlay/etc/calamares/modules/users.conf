# users.conf — user creation defaults.
#
# Calamares creates the account, sets the password, and puts the new
# user in the standard groups. autologinGroup / sudoersGroup let the
# user run sudo without re-typing their password (Claw OS convention).

userShell: "/bin/bash"

defaultGroups:
- users
- lp
- audio
- video
- plugdev
- netdev
- scanner
- bluetooth
- sudo

autologinGroup: autologin
sudoersGroup:   sudo

setRootPassword: false
doAutologin:     true
