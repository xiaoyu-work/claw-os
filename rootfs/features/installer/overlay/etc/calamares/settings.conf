# Calamares settings.conf — Claw OS installer.
#
# The module sequence below is the canonical "Debian-style" install:
# show pages collect user input first, then exec pages perform the
# actual install once all input is gathered. This matches what
# calamares-settings-debian ships and what most Calamares users expect.

modules-search: [ local, /usr/lib/x86_64-linux-gnu/calamares/modules, /usr/lib/calamares/modules ]

instances:
- id: rootfs
  module: unpackfs
  config: unpackfs.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs@rootfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - networkcfg
  - hwclock
  - services-systemd
  - bootloader-config
  - grubcfg
  - bootloader
  - umount
- show:
  - finished

branding: claw-os

prompt-install: true
dont-chroot: false
