# /etc/wsl.conf — WSL2 configuration for claw-os.
#
# We rely on systemd to bring up cos via cos-den-setup.service. Do NOT
# add a [boot] command= here — that would double-execute setup-den.sh
# (once via systemd, once via WSL's command hook).

[boot]
systemd=true

[interop]
enabled=true
appendWindowsPath=false

[network]
generateHosts=true
generateResolvConf=true
