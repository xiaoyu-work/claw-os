<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../../lib/ui.css">
  <link rel="stylesheet" href="composeAction.css">
  <title data-i18n="compose_title">Compose AI</title>
</head>
<body class="compose-popup">

  <div class="tabs">
    <button class="tab active" data-mode="reply"   data-i18n="tab_smart_reply">Smart Reply</button>
    <button class="tab"        data-mode="compose" data-i18n="tab_smart_compose">Smart Compose</button>
  </div>

  <!-- ================= Smart Reply panel ================= -->
  <section id="panel-reply" class="panel">

    <label data-i18n="label_intent">Optional hint (what you want to say)</label>
    <input type="text" id="reply-intent" data-i18n-placeholder="ph_reply_intent" placeholder="e.g. decline politely">

    <div class="row" style="margin-top: 8px;">
      <button class="primary" id="btn-suggest"  data-i18n="action_suggest">Suggest replies</button>
      <div class="grow"></div>
      <span class="muted mono" id="reply-meta"></span>
    </div>

    <div id="reply-out"></div>

    <div id="reply-usage" class="usage-line"></div>
  </section>

  <!-- ================= Smart Compose panel ================= -->
  <section id="panel-compose" class="panel" style="display: none;">

    <label data-i18n="label_intent_compose">What do you want to say?</label>
    <textarea id="compose-intent" data-i18n-placeholder="ph_compose_intent"
              placeholder="e.g. confirm the meeting on Friday at 3pm, and ask for the agenda"></textarea>

    <div class="row" style="margin-top: 8px;">
      <label style="margin: 0 4px 0 0;" data-i18n="label_style">Style</label>
      <select id="compose-style">
        <option value="formal" data-i18n="style_formal">Formal</option>
        <option value="casual" data-i18n="style_casual">Casual</option>
        <option value="short"  data-i18n="style_short">Short</option>
      </select>
      <div class="grow"></div>
      <button class="primary" id="btn-compose-generate" data-i18n="action_generate">Generate</button>
    </div>

    <div id="compose-out"></div>

    <div id="compose-usage" class="usage-line"></div>
  </section>

  <script src="../../lib/ui.js"></script>
  <script src="../../lib/messages.js"></script>
  <script src="composeAction.js"></script>
</body>
</html>
